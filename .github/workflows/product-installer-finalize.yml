name: Finalize product installer hardening

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/product-installer-finalize.yml"

permissions:
  contents: write

env:
  CI: true

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply validated installer hardening
        run: |
          python scripts/xtf-withdrawal-preflight.py
          python scripts/xtf-withdrawal-finalize.py
      - name: Validate formatting and types
        run: |
          npm run format:check
          npm run typecheck
      - name: Validate product lifecycle and installer
        run: >-
          npx vitest run
          apps/cli/src/installer.test.ts
          apps/cli/src/product-data.test.ts
          apps/cli/src/user-experience.test.ts
      - name: Validate distributable package
        run: npm run package:smoke
      - name: Validate lint
        run: npm run lint
      - name: Commit only validated product changes
        shell: bash
        run: |
          git rm scripts/xtf-withdrawal-preflight.py
          git rm scripts/xtf-withdrawal-finalize.py
          git rm .github/workflows/product-installer-finalize.yml
          git add apps/cli/src/installer.ts apps/cli/src/installer.test.ts .github/workflows/product-readiness.yml README.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(product): harden desktop release installation"
          git pull --rebase origin xtf/lhic-learnloop
          git push origin HEAD:xtf/lhic-learnloop
