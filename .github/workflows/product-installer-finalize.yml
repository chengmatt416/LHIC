name: Diagnose product installer finalization

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/product-installer-finalize.yml"

permissions:
  contents: write

env:
  CI: true

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply validated installer hardening
        run: |
          python scripts/xtf-withdrawal-preflight.py
          python scripts/xtf-withdrawal-finalize.py
      - name: Revalidate product changes
        run: |
          npm run format:check
          npm run typecheck
          npx vitest run apps/cli/src/installer.test.ts apps/cli/src/product-data.test.ts apps/cli/src/user-experience.test.ts
          npm run package:smoke
          npm run lint
      - name: Record every Git finalization command
        id: git-diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set +e
          exec > >(tee product-installer-git-diagnostic.log) 2>&1
          run_command() {
            echo
            echo "### $*"
            "$@"
            status=$?
            echo "exit=$status"
            return 0
          }
          run_command git status --short
          run_command git rm scripts/xtf-withdrawal-preflight.py
          run_command git rm scripts/xtf-withdrawal-finalize.py
          run_command git rm .github/workflows/product-installer-finalize.yml
          run_command git add apps/cli/src/installer.ts apps/cli/src/installer.test.ts .github/workflows/product-readiness.yml README.md
          run_command git diff --cached --check
          run_command git diff --cached --stat
          run_command git config user.name github-actions-bot
          run_command git config user.email 41898282+github-actions-bot@users.noreply.github.com
          run_command git commit -m "fix(product): harden desktop release installation"
          run_command git status --short
          run_command git pull --rebase origin xtf/lhic-learnloop
          run_command git push --dry-run origin HEAD:xtf/lhic-learnloop
          exit 1
      - name: Upload Git diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-installer-git-diagnostic
          path: product-installer-git-diagnostic.log
          if-no-files-found: error
          retention-days: 1
      - name: Stop after diagnostic
        if: always()
        run: exit 1
