name: XTF temporary production audit diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI: true

jobs:
  audit-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture production audit JSON
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > audit-output.json
          status=$?
          echo "$status" > audit-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: xtf-production-audit-diagnostics
          path: |
            audit-output.json
            audit-exit-code.txt
          retention-days: 1
