name: XTF production correction final test diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reproduce the successful hardening step
        shell: bash
        run: |
          git fetch --depth=1 origin 521b6fe4809ac06fbe2a864622ee58325837eaba
          git show 521b6fe4809ac06fbe2a864622ee58325837eaba:.github/workflows/xtf-production-hardening-diagnostic.yml > /tmp/finalizer.yml
          python <<'PY'
          from pathlib import Path

          lines = Path("/tmp/finalizer.yml").read_text().splitlines()
          step = next(i for i, line in enumerate(lines) if "Reproduce and harden the normalized production patch" in line)
          run = next(i for i in range(step, len(lines)) if lines[i].strip() == "run: |") + 1
          end = next(i for i in range(run, len(lines)) if lines[i].startswith("      - name: Format changed files"))
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines[run:end]
          ) + "\n"
          Path("/tmp/hardening-step.sh").write_text(script)
          PY
          bash /tmp/hardening-step.sh
      - name: Format and typecheck candidate
        run: |
          npx prettier --write \
            packages/controller/src/correction-replay-store.ts \
            packages/controller/src/correction-replay-store.test.ts \
            apps/desktop/src/main/correction-ingestion-runtime.ts \
            apps/desktop/src/main/correction-ingestion-runtime.test.ts \
            apps/desktop/src/main/correction-submission-validation.ts \
            apps/desktop/src/main/correction-submission-validation.test.ts \
            apps/desktop/src/main/task-service-correction-ingestion.test.ts \
            apps/desktop/src/main/task-service.ts \
            apps/desktop/src/main/controller.ts \
            apps/desktop/src/main/main.ts \
            apps/desktop/src/preload/preload.ts \
            apps/desktop/src/shared/contracts.ts
          npm run format:check
          npm run typecheck
      - name: Capture test and lint output
        shell: bash
        run: |
          mkdir -p correction-diagnostic
          set +e
          npx vitest run \
            packages/controller/src/correction-replay-store.test.ts \
            packages/controller/src/trusted-correction-ingestion.test.ts \
            apps/desktop/src/main/correction-ingestion-runtime.test.ts \
            apps/desktop/src/main/correction-submission-validation.test.ts \
            apps/desktop/src/main/task-service-correction-ingestion.test.ts \
            apps/desktop/src/main/prediction-first-browser-admission.test.ts \
            apps/desktop/src/main/task-service-learnloop.test.ts \
            > correction-diagnostic/tests.log 2>&1
          echo "$?" > correction-diagnostic/tests.status
          npm run lint > correction-diagnostic/lint.log 2>&1
          echo "$?" > correction-diagnostic/lint.status
          set -e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xtf-production-correction-final-test-diagnostic
          path: correction-diagnostic
          retention-days: 1
