name: XTF production correction ingress final validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reproduce and harden the normalized production patch
        shell: bash
        run: |
          git fetch --depth=1 origin 32f9325638e3e47a803adfe4498f3dd4bb81e6b1
          git show 32f9325638e3e47a803adfe4498f3dd4bb81e6b1:.github/workflows/xtf-production-correction-ingress.yml > /tmp/original-ingress.yml
          python <<'PY'
          from pathlib import Path

          workflow = Path("/tmp/original-ingress.yml").read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == "PY")
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end]
          ) + "\n"
          replacements = [
              (
                  "'''  public executeTask(commandId: string): Promise<CommandEvent> {\n      return this.tasks.execute(commandId);\n    }\n\n    public cancelTask(commandId: string): Promise<void> {\n'''",
                  "'''  public executeTask(commandId: string): Promise<CommandEvent> {\n    return this.tasks.execute(commandId);\n  }\n\n  public cancelTask(commandId: string): Promise<void> {\n'''",
              ),
              (
                  "'''  ipcMain.handle(\"lhic:task:cancel\", (_event, commandId: string) =>\n      controller.cancelTask(requiredString(commandId, \"command id\")),\n    );\n'''",
                  "'''  ipcMain.handle(\"lhic:task:cancel\", (_event, commandId: string) =>\n    controller.cancelTask(requiredString(commandId, \"command id\")),\n  );\n'''",
              ),
          ]
          for bad, good in replacements:
              if script.count(bad) != 1:
                  raise RuntimeError("Expected one normalized production patch anchor.")
              script = script.replace(bad, good, 1)
          Path("/tmp/production-correction-ingress.py").write_text(script)

          replay = Path("packages/controller/src/correction-replay-store.ts")
          source = replay.read_text()
          needle = "  private readonly now: () => Date;\n  private readonly maximumReservations: number;\n"
          if source.count(needle) != 2:
              raise RuntimeError("Expected matching reservation fields in both replay stores.")
          marker = "  private readonly now: () => Date;\n  // XTF_TEMP_IN_MEMORY_SCOPE\n  private readonly maximumReservations: number;\n"
          replay.write_text(source.replace(needle, marker, 1))
          PY
          python /tmp/production-correction-ingress.py
          python <<'PY'
          import re
          from pathlib import Path

          replay = Path("packages/controller/src/correction-replay-store.ts")
          source = replay.read_text()
          marker = "  // XTF_TEMP_IN_MEMORY_SCOPE\n"
          if source.count(marker) != 1:
              raise RuntimeError("Temporary InMemory scope marker was not preserved exactly once.")
          source = source.replace(marker, "", 1)
          count_pattern = re.compile(
              r"(?m)^      this\.pruneExpiredMarkers\(this\.approvalDirectory, this\.now\(\)\.getTime\(\)\);\n      return this\.markerCount\(this\.approvalDirectory\);$"
          )
          source, count = count_pattern.subn(
              "      const nowMs = this.now().getTime();\n"
              "      this.pruneExpiredMarkers(this.approvalDirectory, nowMs);\n"
              "      this.pruneExpiredMarkers(this.nonceDirectory, nowMs);\n"
              "      return this.markerCount(this.approvalDirectory);",
              source,
          )
          if count != 1:
              raise RuntimeError("Expected one replay count pruning block.")
          replay.write_text(source)

          fixture_pattern = re.compile(
              r"(?ms)^([ \t]*)const intent: UserIntent = \{\n.*?^\1\};\n"
          )
          for path_string in [
              "apps/desktop/src/main/correction-ingestion-runtime.test.ts",
              "apps/desktop/src/main/correction-submission-validation.test.ts",
          ]:
              path = Path(path_string)
              test_source = path.read_text()
              matches = list(fixture_pattern.finditer(test_source))
              if len(matches) != 1 or "normalizedGoal" not in matches[0].group(0):
                  raise RuntimeError(f"Expected one legacy UserIntent fixture in {path_string}.")
              indent = matches[0].group(1)
              canonical = (
                  f'{indent}const intent: UserIntent = {{\n'
                  f'{indent}  goal: "Search for release notes",\n'
                  f'{indent}  constraints: {{}},\n'
                  f'{indent}  riskLevel: "low",\n'
                  f'{indent}  requiresConfirmation: false,\n'
                  f'{indent}  missingInformation: [],\n'
                  f'{indent}}};\n'
              )
              path.write_text(
                  test_source[:matches[0].start()]
                  + canonical
                  + test_source[matches[0].end():]
              )

          main = Path("apps/desktop/src/main/main.ts")
          main_source, count = re.subn(
              r"(?m)^\s*HumanIntentCorrectionSubmission,\n",
              "",
              main.read_text(),
          )
          if count != 1:
              raise RuntimeError("Expected one unused correction submission import.")
          main.write_text(main_source)
          PY
      - name: Format changed files
        run: |
          npx prettier --write \
            packages/controller/src/correction-replay-store.ts \
            packages/controller/src/correction-replay-store.test.ts \
            apps/desktop/src/main/correction-ingestion-runtime.ts \
            apps/desktop/src/main/correction-ingestion-runtime.test.ts \
            apps/desktop/src/main/correction-submission-validation.ts \
            apps/desktop/src/main/correction-submission-validation.test.ts \
            apps/desktop/src/main/task-service-correction-ingestion.test.ts \
            apps/desktop/src/main/task-service.ts \
            apps/desktop/src/main/controller.ts \
            apps/desktop/src/main/main.ts \
            apps/desktop/src/preload/preload.ts \
            apps/desktop/src/shared/contracts.ts
      - run: npm run format:check
      - run: npm run typecheck
      - name: Run correction boundary tests
        run: >-
          npx vitest run
          packages/controller/src/correction-replay-store.test.ts
          packages/controller/src/trusted-correction-ingestion.test.ts
          apps/desktop/src/main/correction-ingestion-runtime.test.ts
          apps/desktop/src/main/correction-submission-validation.test.ts
          apps/desktop/src/main/task-service-correction-ingestion.test.ts
          apps/desktop/src/main/prediction-first-browser-admission.test.ts
          apps/desktop/src/main/task-service-learnloop.test.ts
      - run: npm run lint
      - name: Commit validated production ingress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/controller/src/correction-replay-store.ts \
            packages/controller/src/correction-replay-store.test.ts \
            apps/desktop/src/main/correction-ingestion-runtime.ts \
            apps/desktop/src/main/correction-ingestion-runtime.test.ts \
            apps/desktop/src/main/correction-submission-validation.ts \
            apps/desktop/src/main/correction-submission-validation.test.ts \
            apps/desktop/src/main/task-service-correction-ingestion.test.ts \
            apps/desktop/src/main/task-service.ts \
            apps/desktop/src/main/controller.ts \
            apps/desktop/src/main/main.ts \
            apps/desktop/src/preload/preload.ts \
            apps/desktop/src/shared/contracts.ts \
            .env.example
          git commit -m "feat(xtf): wire signed corrections into Desktop LearnLoop"
          git pull --rebase origin xtf/lhic-learnloop
          git push origin HEAD:xtf/lhic-learnloop
