name: XTF production correction test diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reproduce the validated production patch
        shell: bash
        run: |
          git fetch --depth=1 origin 4db5af93084eb4fb276056e2b12cdb83e7c5aa4c
          git show 4db5af93084eb4fb276056e2b12cdb83e7c5aa4c:.github/workflows/xtf-production-correction-ingress-v2.yml > /tmp/validation.yml
          python <<'PY'
          from pathlib import Path

          workflow = Path("/tmp/validation.yml").read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == "PY")
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end]
          ) + "\n"
          Path("/tmp/production-correction-ingress.py").write_text(script)
          PY
          python /tmp/production-correction-ingress.py
          python <<'PY'
          from pathlib import Path

          replay = Path("packages/controller/src/correction-replay-store.ts")
          source = replay.read_text()
          marker = "  // XTF_TEMP_IN_MEMORY_SCOPE\n"
          if source.count(marker) != 1:
              raise RuntimeError("Temporary InMemory scope marker was not preserved exactly once.")
          replay.write_text(source.replace(marker, "", 1))
          PY
      - name: Format and typecheck candidate
        run: |
          npx prettier --write \
            packages/controller/src/correction-replay-store.ts \
            packages/controller/src/correction-replay-store.test.ts \
            apps/desktop/src/main/correction-ingestion-runtime.ts \
            apps/desktop/src/main/correction-ingestion-runtime.test.ts \
            apps/desktop/src/main/correction-submission-validation.ts \
            apps/desktop/src/main/correction-submission-validation.test.ts \
            apps/desktop/src/main/task-service-correction-ingestion.test.ts \
            apps/desktop/src/main/task-service.ts \
            apps/desktop/src/main/controller.ts \
            apps/desktop/src/main/main.ts \
            apps/desktop/src/preload/preload.ts \
            apps/desktop/src/shared/contracts.ts
          npm run format:check
          npm run typecheck
      - name: Capture test and lint outputs
        shell: bash
        run: |
          mkdir -p correction-diagnostic
          set +e
          npx vitest run \
            packages/controller/src/correction-replay-store.test.ts \
            packages/controller/src/trusted-correction-ingestion.test.ts \
            apps/desktop/src/main/correction-ingestion-runtime.test.ts \
            apps/desktop/src/main/correction-submission-validation.test.ts \
            apps/desktop/src/main/task-service-correction-ingestion.test.ts \
            apps/desktop/src/main/prediction-first-browser-admission.test.ts \
            apps/desktop/src/main/task-service-learnloop.test.ts \
            > correction-diagnostic/tests.log 2>&1
          echo "$?" > correction-diagnostic/tests.status
          npm run lint > correction-diagnostic/lint.log 2>&1
          echo "$?" > correction-diagnostic/lint.status
          set -e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xtf-production-correction-test-diagnostic
          path: correction-diagnostic
          retention-days: 1
