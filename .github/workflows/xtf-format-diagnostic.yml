name: XTF one-shot formatting fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format only the verified runtime files
        run: >-
          npx prettier --write
          apps/desktop/src/main/desktop-browser-runner.ts
          apps/desktop/src/main/task-service-learnloop.test.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: >-
          npx vitest run
          apps/desktop/src/main/prediction-first-browser-admission.test.ts
          apps/desktop/src/main/task-service-learnloop.test.ts
          packages/controller/src/human-intent-learnloop.test.ts
          packages/controller/src/prediction-first-human-intent-controller.test.ts
      - run: npm run lint
      - name: Commit code-only formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/desktop/src/main/desktop-browser-runner.ts \
            apps/desktop/src/main/task-service-learnloop.test.ts
          git commit -m "style(xtf): format runtime wiring"
          git push origin HEAD:xtf/lhic-learnloop
