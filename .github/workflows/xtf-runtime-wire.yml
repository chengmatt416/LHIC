name: XTF one-shot runtime wiring

on:
  push:
    branches:
      - xtf/lhic-learnloop

permissions:
  contents: write

env:
  CI: true

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply prediction-first runtime wiring
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, before: str, after: str) -> None:
              file = Path(path)
              source = file.read_text()
              if source.count(before) != 1:
                  raise RuntimeError(f"Expected exactly one match in {path}: {before[:80]!r}")
              file.write_text(source.replace(before, after, 1))

          runner = "apps/desktop/src/main/desktop-browser-runner.ts"
          replace_once(
              runner,
              '''import {
            ConsoleNetworkObserver,
            createProductionExecutor,
            type PlaywrightDirectExecutor,
          } from "@lhic/browser";''',
              '''import {
            BrowserStateObserver,
            ConsoleNetworkObserver,
            createProductionExecutor,
            type PlaywrightDirectExecutor,
          } from "@lhic/browser";''',
          )
          replace_once(
              runner,
              '''  isBrowserExecutionPlan,
            type BrowserExecutionPlan,
            type BrowserSemanticAction,
          } from "@lhic/schema";''',
              '''  isBrowserExecutionPlan,
            type BrowserExecutionPlan,
            type BrowserSemanticAction,
            type NormalizedUIState,
          } from "@lhic/schema";''',
          )
          replace_once(
              runner,
              '''  status: "awaiting_approval" | "completed" | "failed" | "cancelled";''',
              '''  status:
              | "awaiting_approval"
              | "blocked"
              | "completed"
              | "failed"
              | "cancelled";''',
          )
          replace_once(
              runner,
              '''export interface BrowserReadiness {
            ready: boolean;
            executablePath: string;
            message: string;
          }
          ''',
              '''export interface BrowserReadiness {
            ready: boolean;
            executablePath: string;
            message: string;
          }

          export interface BrowserIntentAdmissionDecision {
            allowed: boolean;
            message: string;
            evidence: string[];
          }

          export type BrowserIntentAdmission = (
            uiState: NormalizedUIState,
          ) =>
            | BrowserIntentAdmissionDecision
            | Promise<BrowserIntentAdmissionDecision>;
          ''',
          )
          replace_once(
              runner,
              '''  public async execute(
            commandId: string,
            plan: BrowserExecutionPlan,
          ): Promise<BrowserRunResult> {''',
              '''  public async execute(
            commandId: string,
            plan: BrowserExecutionPlan,
            admission?: BrowserIntentAdmission,
          ): Promise<BrowserRunResult> {''',
          )
          replace_once(
              runner,
              '''    this.sessions.set(commandId, session);
            return this.run(commandId);''',
              '''    this.sessions.set(commandId, session);
            if (admission) {
              const bootstrap = session.plan.steps[0];
              if (
                !bootstrap ||
                bootstrap.action.type !== "navigate" ||
                requiresInteractiveApproval(bootstrap.action)
              ) {
                return this.finishBlocked(
                  commandId,
                  session,
                  "Human-intent admission requires one low-risk navigation bootstrap.",
                );
              }
              const execution = await session.executor.execute(bootstrap.action);
              if (!execution.success) {
                return this.finishFailure(
                  commandId,
                  session,
                  execution.error ?? "The observation bootstrap failed.",
                );
              }
              const verification = await session.verifier.verify(
                bootstrap.verification,
              );
              if (!verification.success || verification.evidence.length === 0) {
                return this.finishFailure(
                  commandId,
                  session,
                  verification.error ??
                    "The observation bootstrap produced no verifier evidence.",
                );
              }
              session.executor.rememberVerifiedAction(
                bootstrap.action,
                verification,
              );
              session.evidence.push(...execution.evidence, ...verification.evidence);
              session.nextStepIndex = 1;

              let decision: BrowserIntentAdmissionDecision;
              try {
                const observer = new BrowserStateObserver(page, networkObserver);
                decision = await admission(await observer.observe());
              } catch {
                return this.finishBlocked(
                  commandId,
                  session,
                  "Human-intent admission failed closed before task actions.",
                );
              }
              session.evidence.push(
                ...decision.evidence
                  .slice(0, 32)
                  .map((entry) => entry.slice(0, 1_000)),
              );
              if (!decision.allowed) {
                return this.finishBlocked(
                  commandId,
                  session,
                  decision.message.slice(0, 1_000),
                );
              }
            }
            return this.run(commandId);''',
          )
          replace_once(
              runner,
              '''  private async finishFailure(
            commandId: string,
            session: BrowserSession,
            message: string,
          ): Promise<BrowserRunResult> {''',
              '''  private async finishBlocked(
            commandId: string,
            session: BrowserSession,
            message: string,
          ): Promise<BrowserRunResult> {
            const result: BrowserRunResult = {
              status: "blocked",
              message,
              evidence: [...session.evidence],
              proposal: summarizePlan(session.plan),
            };
            await this.cancel(commandId);
            return result;
          }

          private async finishFailure(
            commandId: string,
            session: BrowserSession,
            message: string,
          ): Promise<BrowserRunResult> {''',
          )

          service = "apps/desktop/src/main/task-service.ts"
          replace_once(
              service,
              '''import { compileLocalFastPath } from "./fast-path-planner.js";''',
              '''import { compileLocalFastPath } from "./fast-path-planner.js";
          import { DesktopHumanIntentAdmission } from "./prediction-first-browser-admission.js";''',
          )
          replace_once(
              service,
              '''interface TaskServiceOptions {
            sourceStore?: Pick<TaskSourceStore, "load" | "save">;
            journalStore?: Pick<TaskJournalStore, "load" | "save">;
            sourceBudget?: () => TaskBudgetTracker;
          }''',
              '''type BrowserRunner = Pick<
            DesktopBrowserRunner,
            "approve" | "cancel" | "close" | "execute" | "readiness"
          >;

          interface TaskServiceOptions {
            sourceStore?: Pick<TaskSourceStore, "load" | "save">;
            journalStore?: Pick<TaskJournalStore, "load" | "save">;
            sourceBudget?: () => TaskBudgetTracker;
            browserRunner?: BrowserRunner;
            humanIntentAdmission?: DesktopHumanIntentAdmission;
          }''',
          )
          replace_once(
              service,
              '''  private readonly browserRunner: DesktopBrowserRunner;
            private readonly globalRunner: DesktopGlobalRunner;''',
              '''  private readonly browserRunner: BrowserRunner;
            private readonly globalRunner: DesktopGlobalRunner;
            private readonly humanIntentAdmission: DesktopHumanIntentAdmission;''',
          )
          replace_once(
              service,
              '''    this.browserRunner = new DesktopBrowserRunner(workspaceRoot);
            this.globalRunner = new DesktopGlobalRunner(workspaceRoot);''',
              '''    this.browserRunner =
              options.browserRunner ?? new DesktopBrowserRunner(workspaceRoot);
            this.globalRunner = new DesktopGlobalRunner(workspaceRoot);
            this.humanIntentAdmission =
              options.humanIntentAdmission ?? new DesktopHumanIntentAdmission();''',
          )
          replace_once(
              service,
              '''        message:
                  "A deterministic local Fast Path was compiled. It has not executed; start the browser session to continue through the normal approval and verifier gates.",''',
              '''        message:
                  "A deterministic local Fast Path candidate was compiled. It has not executed; the browser will observe the live target UI and run Human Intent admission before task actions.",''',
          )
          replace_once(
              service,
              '''          "Fast Path compiled locally with zero LLM calls and zero MCP calls.",
                  `Compiled ${plan.steps.length} browser steps with verifier conditions.`,''',
              '''          "Fast Path compiled locally with zero LLM calls and zero MCP calls.",
                  "Live normalized UI and prediction-first admission are required after the exact start URL bootstrap.",
                  `Compiled ${plan.steps.length} browser steps with verifier conditions.`,''',
          )
          replace_once(
              service,
              '''      this.pending.set(event.commandId, {
                goal: input.goal,
                phase: "execution",
                plan,
              });''',
              '''      this.pending.set(event.commandId, {
                goal: input.goal,
                ...(startUrl ? { startUrl } : {}),
                phase: "execution",
                plan,
              });''',
          )
          replace_once(
              service,
              '''        ? this.recordBrowserResult(
                    commandId,
                    await this.browserRunner.execute(commandId, plan),
                  )''',
              '''        ? this.recordBrowserResult(
                    commandId,
                    await this.browserRunner.execute(
                      commandId,
                      plan,
                      !pending.source && plan.skillName
                        ? (uiState) =>
                            this.humanIntentAdmission.evaluate(
                              commandId,
                              pending.goal,
                              plan,
                              uiState,
                            )
                        : undefined,
                    ),
                  )''',
          )
          replace_once(
              service,
              '''    if (result.status === "completed" || result.status === "failed") {
              this.pending.delete(commandId);''',
              '''    if (
              result.status === "blocked" ||
              result.status === "completed" ||
              result.status === "failed"
            ) {
              this.pending.delete(commandId);''',
          )

          test = "apps/desktop/src/main/task-service-learnloop.test.ts"
          replace_once(
              test,
              '''import type { NormalizedUIState } from "@lhic/schema";''',
              '''import type {
            BrowserExecutionPlan,
            NormalizedUIState,
          } from "@lhic/schema";''',
          )
          replace_once(
              test,
              '''      plan: Parameters<BrowserIntentAdmission>[2],''',
              '''      plan: BrowserExecutionPlan,''',
          )

          workflow = ".github/workflows/xtf-learnloop.yml"
          replace_once(
              workflow,
              '''      - "apps/cli/src/entry.ts"
                - "XTF-LEARNLOOP.md"''',
              '''      - "apps/cli/src/entry.ts"
                - "apps/desktop/src/main/desktop-browser-runner.ts"
                - "apps/desktop/src/main/prediction-first-browser-admission*"
                - "apps/desktop/src/main/task-service.ts"
                - "apps/desktop/src/main/task-service-learnloop.test.ts"
                - "XTF-LEARNLOOP.md"''',
          )
          replace_once(
              workflow,
              '''          apps/cli/src/learnloop-benchmark.test.ts''',
              '''          apps/cli/src/learnloop-benchmark.test.ts
                    apps/desktop/src/main/prediction-first-browser-admission.test.ts
                    apps/desktop/src/main/task-service-learnloop.test.ts''',
          )
          PY
      - name: Format and verify the runtime integration
        run: |
          npx prettier --write \
            apps/desktop/src/main/desktop-browser-runner.ts \
            apps/desktop/src/main/prediction-first-browser-admission.ts \
            apps/desktop/src/main/prediction-first-browser-admission.test.ts \
            apps/desktop/src/main/task-service.ts \
            apps/desktop/src/main/task-service-learnloop.test.ts \
            .github/workflows/xtf-learnloop.yml
          npm run format:check
          npm run typecheck
          npx vitest run \
            packages/controller/src/human-intent-learnloop.test.ts \
            packages/controller/src/prediction-first-human-intent-controller.test.ts \
            apps/desktop/src/main/prediction-first-browser-admission.test.ts \
            apps/desktop/src/main/task-service-learnloop.test.ts
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/xtf-runtime-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat(xtf): wire LearnLoop into desktop Fast Path"
          git push origin HEAD:xtf/lhic-learnloop
