name: XTF final dependency and runtime commit v3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Extract the reviewed patch and pin the audited MCP version
        run: |
          python <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/xtf-finalize-dependencies.yml').read_text().splitlines()
          blocks = []
          index = 0
          while index < len(lines):
              if "node <<'NODE'" not in lines[index]:
                  index += 1
                  continue
              start = index + 1
              end = next(
                  candidate
                  for candidate in range(start, len(lines))
                  if lines[candidate].strip() == 'NODE'
              )
              blocks.append(
                  '\n'.join(
                      line[10:] if line.startswith('          ') else line
                      for line in lines[start:end]
                  ) + '\n'
              )
              index = end + 1

          patch = blocks[0].replace(
              r"\\`@huggingface/transformers\\`",
              "'@huggingface/transformers'",
          )
          patch += r'''
          {
            const mcpPath = "apps/mcp-server/package.json";
            const mcpPackage = JSON.parse(read(mcpPath));
            mcpPackage.dependencies["@modelcontextprotocol/sdk"] = "1.24.3";
            write(mcpPath, `${JSON.stringify(mcpPackage, null, 2)}\n`);

            const rootPath = "package.json";
            const rootPackage = JSON.parse(read(rootPath));
            if (rootPackage.overrides) {
              delete rootPackage.overrides["@hono/node-server"];
            }
            write(rootPath, `${JSON.stringify(rootPackage, null, 2)}\n`);
          }
          '''
          Path('/tmp/xtf-final-patch.js').write_text(patch)

          commit = blocks[1]
          old_filter = (
              '                path !== ".github/workflows/xtf-finalize-dependencies.yml",'
          )
          new_filter = (
              '                path !== ".github/workflows/xtf-finalize-dependencies.yml" &&\n'
              '                path !== ".github/workflows/xtf-finalize-dependencies-v2.yml" &&\n'
              '                path !== ".github/workflows/xtf-finalize-dependencies-v3.yml" &&\n'
              '                path !== ".github/workflows/xtf-audit-after-remediation.yml",'
          )
          if old_filter not in commit:
              raise RuntimeError('Commit filter insertion point is missing.')
          commit = commit.replace(old_filter, new_filter)
          old_deletion = (
              '              ".github/workflows/xtf-finalize-dependencies.yml",\n'
          )
          new_deletion = (
              '              ".github/workflows/xtf-finalize-dependencies.yml",\n'
              '              ".github/workflows/xtf-finalize-dependencies-v2.yml",\n'
              '              ".github/workflows/xtf-finalize-dependencies-v3.yml",\n'
              '              ".github/workflows/xtf-audit-after-remediation.yml",\n'
          )
          if old_deletion not in commit:
              raise RuntimeError('Commit deletion insertion point is missing.')
          commit = commit.replace(old_deletion, new_deletion)
          Path('/tmp/xtf-final-commit.js').write_text(commit)
          PY
          node /tmp/xtf-final-patch.js
      - name: Resolve a clean production dependency graph
        run: |
          SAFE_TAR_VERSION="$(npm view tar version)"
          npm pkg set "overrides.tar=${SAFE_TAR_VERSION}"
          npm install --package-lock-only
          npm audit fix --package-lock-only --omit=dev || true
          npm ci
          npm audit --omit=dev --audit-level=moderate
      - run: npm run pw:install
      - name: Format and validate the complete repository
        run: |
          npm run format
          npm run format:check
          npm run typecheck
          npm test
          npm run lint
          npm run build
          npm run bench:internal
          npm run bench:learnloop
          npm run preflight
          npm run audit:prod
          npm run check:docs
          npm run check:release-versions
          npm run scan:secrets
          PYTHONPATH=benchmarks/agentlab python -m unittest discover -s benchmarks/agentlab/tests
          python packages/game-training/python/test_worker.py
          python -m py_compile benchmarks/agentlab/lhic_semantic_policy.py benchmarks/agentlab/lhic_agent.py benchmarks/agentlab/preflight.py benchmarks/agentlab/run_study.py
      - name: Create the validated Git commit object
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node /tmp/xtf-final-commit.js
      - uses: actions/upload-artifact@v4
        with:
          name: xtf-validated-final-commit-v3
          path: validated-final-commit.json
          if-no-files-found: error
          retention-days: 1
