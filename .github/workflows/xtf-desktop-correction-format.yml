name: XTF desktop correction formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          apps/desktop/src/main/prediction-first-browser-admission.ts
          apps/desktop/src/main/prediction-first-browser-admission.test.ts
      - run: npm run format:check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/desktop/src/main/prediction-first-browser-admission.ts \
            apps/desktop/src/main/prediction-first-browser-admission.test.ts
          git commit -m "style(xtf): format desktop correction wiring"
          git pull --rebase origin xtf/lhic-learnloop
          git push origin HEAD:xtf/lhic-learnloop
