name: Rust CI

on:
  pull_request:
  push:
    branches: [main, rust-rewrite-alpha]

permissions:
  contents: read

jobs:
  rust-verify:
    name: Rust verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86"
          components: rustfmt, clippy
      - name: Install Python (fake-engine tests)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check (all targets)
        if: runner.os != 'macOS'
        run: cargo check --workspace --all-targets
      - name: Check (all targets, macOS)
        if: runner.os == 'macOS'
        # ring 0.17.14 const-asserts that aarch64-apple-darwin exposes
        # exactly {neon,aes,sha2,pmull}; macos-14 arm64 runners report a
        # mismatched static feature set under target-cpu=generic. Pin the
        # target CPU for macOS so the static features match.
        env:
          RUSTFLAGS: "-C target-cpu=apple-m1"
        run: cargo check --workspace --all-targets
      - name: Clippy (deny warnings)
        if: runner.os != 'macOS'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (deny warnings, macOS)
        if: runner.os == 'macOS'
        env:
          RUSTFLAGS: "-C target-cpu=apple-m1"
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        if: runner.os != 'macOS'
        run: cargo test --workspace
      - name: Test workspace (macOS)
        if: runner.os == 'macOS'
        env:
          RUSTFLAGS: "-C target-cpu=apple-m1"
        run: cargo test --workspace

  omp-integration:
    name: OMP RPC integration (Linux, verified pinned engine)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86"
      - name: Acquire and verify pinned OMP engine
        shell: bash
        run: |
          set -eu
          mkdir -p .omp-cache
          # Downloads omp-linux-x64 from the official v17.2.15 release,
          # verifies its SHA-256 against .omp-trust/manifest.json, verifies
          # the exact engine version, then writes the verified binary.
          sh scripts/acquire-omp.sh linux-x64 .omp-cache/omp
      - name: Run supply-chain trust tests
        run: cargo test -p lhic-agent --lib rpc::trust
      - name: Run real-OMP integration tests (missing engine fails)
        env:
          OMP_BINARY: ${{ github.workspace }}/.omp-cache/omp
          OMP_REQUIRED: "1"
          # The engine refuses to start without any provider credential; a
          # placeholder key keeps it alive for protocol verification. The
          # prompt test tolerates a precise model/auth rejection.
          OPENAI_API_KEY: sk-lhic-ci-placeholder-0000000000000000
        run: cargo test -p lhic-agent --test omp_rpc_integration
      - name: Run fake-engine protocol tests
        run: cargo test -p lhic-agent --test fake_engine_tests
