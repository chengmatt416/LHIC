          import { createDesktopHumanIntentCorrectionRuntime } from "./correction-ingestion-runtime.js";

          const temporaryDirectories: string[] = [];
          const keyPair = generateKeyPairSync("ed25519");
          const publicKey = keyPair.publicKey
