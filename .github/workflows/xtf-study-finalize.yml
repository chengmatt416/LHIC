name: XTF withdrawal privacy hardening verifier

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/cli/src/learnloop-study-labeling*"
      - "apps/cli/src/learnloop-study-withdrawal*"
      - "scripts/xtf-withdrawal-hardening.py"
      - ".github/workflows/xtf-study-finalize.yml"
  push:
    branches: [xtf/lhic-learnloop]

permissions:
  contents: read

env:
  CI: true

concurrency:
  group: xtf-withdrawal-privacy-hardening-verifier
  cancel-in-progress: true

jobs:
  verify-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply withdrawal privacy hardening in the runner
        run: python scripts/xtf-withdrawal-hardening.py
      - name: Format hardening changes
        run: >-
          npx prettier --write
          apps/cli/src/learnloop-study-labeling.ts
          apps/cli/src/learnloop-study-withdrawal.ts
          apps/cli/src/learnloop-study-withdrawal.test.ts
          docs/xtf-study-preregistration.md
          docs/xtf-adversarial-review.md
      - run: npm run format:check
      - run: npm run typecheck
      - name: Test withdrawal, labeling, and analysis invariants
        run: >-
          npx vitest run
          apps/cli/src/learnloop-study-withdrawal.test.ts
          apps/cli/src/learnloop-study-labeling.test.ts
          apps/cli/src/learnloop-study.test.ts
      - run: npm run lint
      - name: Stage verified files
        shell: bash
        run: |
          mkdir -p verified
          cp --parents \
            apps/cli/src/learnloop-study-labeling.ts \
            apps/cli/src/learnloop-study-withdrawal.ts \
            apps/cli/src/learnloop-study-withdrawal.test.ts \
            docs/xtf-study-preregistration.md \
            docs/xtf-adversarial-review.md \
            verified/
      - uses: actions/upload-artifact@v4
        with:
          name: xtf-withdrawal-privacy-hardening
          path: verified
          if-no-files-found: error
          retention-days: 1
