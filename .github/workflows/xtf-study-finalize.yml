name: XTF blinded labeling finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/cli/src/learnloop-study-labeling*"
      - "scripts/xtf-labeling-finalize.py"
      - "scripts/xtf-labeling-preflight.py"
      - ".github/workflows/xtf-study-finalize.yml"
  push:
    branches: [xtf/lhic-learnloop]

permissions:
  contents: write

env:
  CI: true

concurrency:
  group: xtf-blinded-labeling-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Stabilize documentation anchor
        run: python scripts/xtf-labeling-preflight.py
      - name: Integrate blinded labeling workflow
        run: python scripts/xtf-labeling-finalize.py
      - name: Format labeling changes
        run: >-
          npx prettier --write
          apps/cli/src/learnloop-study-labeling.ts
          apps/cli/src/learnloop-study-labeling.test.ts
          apps/cli/src/entry.ts
          benchmarks/learnloop-study/README.md
          docs/xtf-study-preregistration.md
          XTF-LEARNLOOP.md
          .github/workflows/xtf-learnloop.yml
      - run: npm run format:check
      - run: npm run typecheck
      - name: Test labeling and study invariants
        run: >-
          npx vitest run
          apps/cli/src/learnloop-study-labeling.test.ts
          apps/cli/src/learnloop-study.test.ts
      - name: Validate public CLI
        run: |
          npx tsx apps/cli/src/entry.ts help | grep -F "finalize-labels"
          npm run study:learnloop -- digest --plan benchmarks/learnloop-study/plan.example.json
      - run: npm run lint
      - name: Commit validated labeling integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/cli/src/learnloop-study-labeling.ts \
            apps/cli/src/learnloop-study-labeling.test.ts \
            apps/cli/src/entry.ts \
            benchmarks/learnloop-study/README.md \
            docs/xtf-study-preregistration.md \
            XTF-LEARNLOOP.md \
            .github/workflows/xtf-learnloop.yml
          git commit -m "feat(xtf): finalize blinded gold-label workflow"
          git push origin HEAD:xtf/lhic-learnloop
