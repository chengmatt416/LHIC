name: XTF scheduler test diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/cli/src/learnloop-study-schedule*"
      - ".github/workflows/xtf-study-finalize.yml"
  push:
    branches: [xtf/lhic-learnloop]

permissions:
  contents: read

env:
  CI: true

jobs:
  scheduler-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run scheduler tests
        id: scheduler
        continue-on-error: true
        shell: bash
        run: npx vitest run apps/cli/src/learnloop-study-schedule.test.ts > scheduler-test.log 2>&1
      - name: Upload scheduler test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xtf-scheduler-test-log
          path: scheduler-test.log
          if-no-files-found: error
          retention-days: 1
      - name: Require scheduler tests
        if: steps.scheduler.outcome != 'success'
        run: |
          cat scheduler-test.log
          exit 1
