name: XTF withdrawal redaction finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/cli/src/learnloop-study-withdrawal*"
      - "scripts/xtf-withdrawal-finalize.py"
      - "scripts/xtf-withdrawal-preflight.py"
      - ".github/workflows/xtf-study-finalize.yml"
  push:
    branches: [xtf/lhic-learnloop]

permissions:
  contents: write

env:
  CI: true

concurrency:
  group: xtf-withdrawal-redaction-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch literal CLI usage newline
        run: python scripts/xtf-withdrawal-preflight.py
      - name: Integrate withdrawal redaction
        id: integration
        continue-on-error: true
        shell: bash
        run: python scripts/xtf-withdrawal-finalize.py > integration.log 2>&1
      - name: Upload integration diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xtf-withdrawal-integration-log
          path: integration.log
          if-no-files-found: error
          retention-days: 1
      - name: Require successful integration
        if: steps.integration.outcome != 'success'
        run: |
          cat integration.log
          exit 1
      - name: Format withdrawal changes
        run: >-
          npx prettier --write
          apps/cli/src/learnloop-study-withdrawal.ts
          apps/cli/src/learnloop-study-withdrawal.test.ts
          apps/cli/src/entry.ts
          benchmarks/learnloop-study/README.md
          docs/xtf-study-preregistration.md
          docs/xtf-adversarial-review.md
          XTF-LEARNLOOP.md
      - run: npm run format:check
      - run: npm run typecheck
      - name: Test withdrawal, labeling, and analysis invariants
        run: >-
          npx vitest run
          apps/cli/src/learnloop-study-withdrawal.test.ts
          apps/cli/src/learnloop-study-labeling.test.ts
          apps/cli/src/learnloop-study.test.ts
      - name: Validate public withdrawal CLI
        run: |
          npx tsx apps/cli/src/entry.ts help | grep -F "study learnloop withdraw"
          npm run study:learnloop -- digest --plan benchmarks/learnloop-study/plan.example.json
      - run: npm run lint
      - name: Commit validated withdrawal integration
        shell: bash
        run: |
          rm scripts/xtf-withdrawal-finalize.py scripts/xtf-withdrawal-preflight.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/cli/src/learnloop-study-withdrawal.ts \
            apps/cli/src/learnloop-study-withdrawal.test.ts \
            apps/cli/src/entry.ts \
            benchmarks/learnloop-study/README.md \
            docs/xtf-study-preregistration.md \
            docs/xtf-adversarial-review.md \
            XTF-LEARNLOOP.md \
            scripts/xtf-withdrawal-finalize.py \
            scripts/xtf-withdrawal-preflight.py
          git commit -m "feat(xtf): add auditable participant withdrawal"
          git push origin HEAD:xtf/lhic-learnloop
