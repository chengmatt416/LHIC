name: XTF study gate formatter exporter

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/xtf-learnloop.yml"
      - ".github/workflows/xtf-study-finalize.yml"
      - ".github/workflows/xtf-labeling-finalize.yml"
  push:
    branches: [xtf/lhic-learnloop]
    paths:
      - ".github/workflows/xtf-learnloop.yml"
      - ".github/workflows/xtf-study-finalize.yml"
      - ".github/workflows/xtf-labeling-finalize.yml"

permissions:
  contents: read

env:
  CI: true

jobs:
  export-formatted-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore permanent read-only protocol gate in workspace
        shell: bash
        run: |
          cat > .github/workflows/xtf-study-finalize.yml <<'YAML'
          name: XTF LearnLoop study protocol gate

          on:
            pull_request:
              branches: [main]
              paths:
                - "apps/cli/src/learnloop-study*"
                - "apps/cli/src/entry.ts"
                - "benchmarks/learnloop-study/**"
                - "docs/xtf-study-*"
                - "XTF-LEARNLOOP.md"
                - "docs/xtf-adversarial-review.md"
                - "package.json"
                - ".github/workflows/xtf-learnloop.yml"
                - ".github/workflows/xtf-study-finalize.yml"
            push:
              branches: [xtf/lhic-learnloop]

          permissions:
            contents: read

          env:
            CI: true

          jobs:
            study-protocol:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - name: Check repository formatting
                  run: npm run format:check
                - name: Typecheck project references
                  run: npm run typecheck
                - name: Test preregistration, scheduling, labeling, withdrawal, and analysis invariants
                  run: >-
                    npx vitest run
                    apps/cli/src/learnloop-study.test.ts
                    apps/cli/src/learnloop-study-schedule.test.ts
                    apps/cli/src/learnloop-study-labeling.test.ts
                    apps/cli/src/learnloop-study-withdrawal.test.ts
                - name: Validate the non-evidence plan example through the public CLI
                  run: >-
                    npm run study:learnloop -- digest
                    --plan benchmarks/learnloop-study/plan.example.json
                - name: Validate public study lifecycle commands
                  run: |
                    npx tsx apps/cli/src/entry.ts help | grep -F "study learnloop schedule"
                    npx tsx apps/cli/src/entry.ts help | grep -F "finalize-labels"
                    npx tsx apps/cli/src/entry.ts help | grep -F "study learnloop withdraw"
                - name: Lint repository
                  run: npm run lint
          YAML
      - name: Format permanent gates
        run: >-
          npx prettier --write
          .github/workflows/xtf-learnloop.yml
          .github/workflows/xtf-study-finalize.yml
          .github/workflows/xtf-labeling-finalize.yml
      - name: Stage formatted gates
        shell: bash
        run: |
          mkdir -p formatted/.github/workflows
          cp .github/workflows/xtf-learnloop.yml formatted/.github/workflows/
          cp .github/workflows/xtf-study-finalize.yml formatted/.github/workflows/
          cp .github/workflows/xtf-labeling-finalize.yml formatted/.github/workflows/
      - uses: actions/upload-artifact@v4
        with:
          name: xtf-formatted-study-gates
          path: formatted
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
