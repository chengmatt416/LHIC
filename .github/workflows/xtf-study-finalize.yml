name: XTF study documentation finalizer

on:
  pull_request:
    branches: [main]
    paths:
      - "XTF-LEARNLOOP.md"
      - "docs/xtf-adversarial-review.md"
      - ".github/workflows/xtf-study-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore the permanent read-only study gate
        shell: bash
        run: |
          cat > .github/workflows/xtf-study-finalize.yml <<'YAML'
          name: XTF LearnLoop study protocol gate

          on:
            pull_request:
              branches: [main]
              paths:
                - "apps/cli/src/learnloop-study*"
                - "apps/cli/src/entry.ts"
                - "benchmarks/learnloop-study/**"
                - "docs/xtf-study-preregistration.md"
                - "XTF-LEARNLOOP.md"
                - "docs/xtf-adversarial-review.md"
                - "package.json"
                - ".github/workflows/xtf-learnloop.yml"
                - ".github/workflows/xtf-study-finalize.yml"
            push:
              branches: [xtf/lhic-learnloop]

          permissions:
            contents: read

          env:
            CI: true

          jobs:
            study-protocol:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - name: Check repository formatting
                  run: npm run format:check
                - name: Typecheck project references
                  run: npm run typecheck
                - name: Test preregistration and analysis invariants
                  run: npx vitest run apps/cli/src/learnloop-study.test.ts
                - name: Validate the non-evidence plan example through the public CLI
                  run: >-
                    npm run study:learnloop -- digest
                    --plan benchmarks/learnloop-study/plan.example.json
                - name: Lint repository
                  run: npm run lint
          YAML
      - name: Format final documents and read-only gate
        run: >-
          npx prettier --write
          XTF-LEARNLOOP.md
          docs/xtf-adversarial-review.md
          .github/workflows/xtf-study-finalize.yml
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx vitest run apps/cli/src/learnloop-study.test.ts
      - name: Validate public study CLI
        run: >-
          npm run study:learnloop -- digest
          --plan benchmarks/learnloop-study/plan.example.json
      - run: npm run lint
      - name: Commit validated final documents
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            XTF-LEARNLOOP.md \
            docs/xtf-adversarial-review.md \
            .github/workflows/xtf-study-finalize.yml
          git commit -m "style(xtf): finalize preregistered study documentation"
          git push origin HEAD:xtf/lhic-learnloop
