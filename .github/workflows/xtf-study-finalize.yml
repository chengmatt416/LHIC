name: XTF repository formatter exporter

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/cli/src/learnloop-study*"
      - "apps/cli/src/entry.ts"
      - "benchmarks/learnloop-study/**"
      - "docs/xtf-study-*"
      - "XTF-LEARNLOOP.md"
      - "docs/xtf-adversarial-review.md"
      - ".github/workflows/xtf-*.yml"
  push:
    branches: [xtf/lhic-learnloop]

permissions:
  contents: read

env:
  CI: true

jobs:
  export-prettier-corrections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore permanent protocol gate in workspace
        shell: bash
        run: |
          cat > .github/workflows/xtf-study-finalize.yml <<'YAML'
          name: XTF LearnLoop study protocol gate

          on:
            pull_request:
              branches: [main]
              paths:
                - "apps/cli/src/learnloop-study*"
                - "apps/cli/src/entry.ts"
                - "benchmarks/learnloop-study/**"
                - "docs/xtf-study-*"
                - "XTF-LEARNLOOP.md"
                - "docs/xtf-adversarial-review.md"
                - "package.json"
                - ".github/workflows/xtf-learnloop.yml"
                - ".github/workflows/xtf-study-finalize.yml"
            push:
              branches: [xtf/lhic-learnloop]

          permissions:
            contents: read

          env:
            CI: true

          jobs:
            study-protocol:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                    cache: npm
                - run: npm ci
                - name: Check repository formatting
                  run: npm run format:check
                - name: Typecheck project references
                  run: npm run typecheck
                - name: Test preregistration, scheduling, labeling, withdrawal, and analysis invariants
                  run: >-
                    npx vitest run
                    apps/cli/src/learnloop-study.test.ts
                    apps/cli/src/learnloop-study-schedule.test.ts
                    apps/cli/src/learnloop-study-labeling.test.ts
                    apps/cli/src/learnloop-study-withdrawal.test.ts
                - name: Validate the non-evidence plan example through the public CLI
                  run: >-
                    npm run study:learnloop -- digest
                    --plan benchmarks/learnloop-study/plan.example.json
                - name: Validate public study lifecycle commands
                  run: |
                    npx tsx apps/cli/src/entry.ts help | grep -F "study learnloop schedule"
                    npx tsx apps/cli/src/entry.ts help | grep -F "finalize-labels"
                    npx tsx apps/cli/src/entry.ts help | grep -F "study learnloop withdraw"
                - name: Lint repository
                  run: npm run lint
          YAML
      - name: Apply repository Prettier in workspace
        run: npx prettier --write .
      - name: Stage changed files and manifest
        shell: bash
        run: |
          git diff --name-only > prettier-changed-files.txt
          test -s prettier-changed-files.txt
          python - <<'PY'
          from pathlib import Path
          import shutil
          destination = Path("formatted")
          for raw in Path("prettier-changed-files.txt").read_text().splitlines():
              source = Path(raw)
              target = destination / source
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          shutil.copy2("prettier-changed-files.txt", destination / "prettier-changed-files.txt")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xtf-repository-prettier-corrections
          path: formatted
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
