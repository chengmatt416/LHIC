name: XTF one-shot documentation formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write XTF-LEARNLOOP.md docs/xtf-adversarial-review.md
      - run: npm run format:check
      - name: Commit formatted research documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add XTF-LEARNLOOP.md docs/xtf-adversarial-review.md
          git commit -m "style(xtf): format final research documents"
          git push origin HEAD:xtf/lhic-learnloop
