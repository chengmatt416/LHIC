name: XTF temporary production audit comparison

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI: true

jobs:
  audit-comparison:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: xtf
            ref: xtf/lhic-learnloop
          - name: main
            ref: main
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture production audit JSON
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > audit-${{ matrix.target.name }}.json 2> audit-${{ matrix.target.name }}.stderr
          echo "$?" > audit-${{ matrix.target.name }}.exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: xtf-audit-${{ matrix.target.name }}
          path: |
            audit-${{ matrix.target.name }}.json
            audit-${{ matrix.target.name }}.stderr
            audit-${{ matrix.target.name }}.exit.txt
          retention-days: 1
