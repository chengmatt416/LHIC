name: XTF dependency install diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI: true

jobs:
  diagnose-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare reviewed security manifests
        run: |
          git fetch --depth=1 origin 5a9096824245251dde43fea4921e71fc02f1499f
          git show 5a9096824245251dde43fea4921e71fc02f1499f:.github/workflows/xtf-dependency-remediation.yml > /tmp/original-remediation.yml
          python <<'PY'
          from pathlib import Path

          lines = Path("/tmp/original-remediation.yml").read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == "PY")
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines[start:end]
          ) + "\n"
          Path("/tmp/apply-remediation.py").write_text(script)
          PY
          python /tmp/apply-remediation.py
          python <<'PY'
          import json
          from pathlib import Path

          mcp_path = Path("apps/mcp-server/package.json")
          mcp = json.loads(mcp_path.read_text())
          mcp["dependencies"]["@modelcontextprotocol/sdk"] = "1.29.0"
          mcp_path.write_text(json.dumps(mcp, indent=2) + "\n")

          root_path = Path("package.json")
          root = json.loads(root_path.read_text())
          root["dependencies"].pop("fast-uri", None)
          root.setdefault("overrides", {})["fast-uri"] = "3.1.4"
          root["overrides"]["@hono/node-server"] = "2.0.11"
          root["overrides"]["tar"] = "7.5.22"
          root_path.write_text(json.dumps(root, indent=2) + "\n")
          PY
      - name: Capture clean lockfile and install results
        shell: bash
        run: |
          mkdir -p install-diagnostics
          cp package.json install-diagnostics/root-package.json
          cp apps/mcp-server/package.json install-diagnostics/mcp-server-package.json
          cp packages/controller/package.json install-diagnostics/controller-package.json
          rm -rf node_modules package-lock.json

          set +e
          npm install --package-lock-only > install-diagnostics/package-lock.log 2>&1
          lock_status=$?
          echo "$lock_status" > install-diagnostics/package-lock.status
          if [ -f package-lock.json ]; then
            cp package-lock.json install-diagnostics/package-lock.json
          fi

          if [ "$lock_status" -eq 0 ]; then
            npm ci > install-diagnostics/npm-ci.log 2>&1
            ci_status=$?
          else
            echo "npm ci skipped because package-lock generation failed." > install-diagnostics/npm-ci.log
            ci_status=99
          fi
          echo "$ci_status" > install-diagnostics/npm-ci.status
          set -e
          cat install-diagnostics/package-lock.status
          cat install-diagnostics/npm-ci.status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xtf-dependency-install-diagnostics
          path: install-diagnostics
          if-no-files-found: error
          retention-days: 1
