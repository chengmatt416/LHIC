name: XTF one-shot production dependency remediation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Upgrade vulnerable production dependency paths
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const controllerPath = 'packages/controller/package.json';
          const controller = JSON.parse(fs.readFileSync(controllerPath, 'utf8'));
          controller.dependencies['@huggingface/transformers'] = '4.2.0';
          fs.writeFileSync(controllerPath, `${JSON.stringify(controller, null, 2)}\n`);

          const rootPath = 'package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          root.overrides = {
            ...(root.overrides ?? {}),
            '@hono/node-server': '2.0.11',
            'fast-uri': '3.1.4',
          };
          fs.writeFileSync(rootPath, `${JSON.stringify(root, null, 2)}\n`);
          NODE
      - name: Resolve lockfile and apply compatible audit fixes
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only --omit=dev
          npm ci
      - run: npm run pw:install
      - name: Require a clean production audit
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Remove temporary workflows and commit reviewed lockfile
        run: |
          git rm .github/workflows/xtf-dependency-remediation.yml
          git rm .github/workflows/xtf-audit-debug.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages/controller/package.json
          git commit -m "fix(xtf): remediate production dependency advisories"
          git push origin HEAD:xtf/lhic-learnloop
