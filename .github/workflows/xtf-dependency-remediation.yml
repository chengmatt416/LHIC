name: XTF dependency remediation diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Reapply the exact reviewed candidate patch
        run: |
          git fetch --depth=1 origin 5a9096824245251dde43fea4921e71fc02f1499f
          git show 5a9096824245251dde43fea4921e71fc02f1499f:.github/workflows/xtf-dependency-remediation.yml > /tmp/original-remediation.yml
          python <<'PY'
          from pathlib import Path

          lines = Path("/tmp/original-remediation.yml").read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == "PY")
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines[start:end]
          ) + "\n"
          Path("/tmp/apply-remediation.py").write_text(script)
          PY
          python /tmp/apply-remediation.py
          python <<'PY'
          import json
          from pathlib import Path

          mcp_path = Path("apps/mcp-server/package.json")
          mcp = json.loads(mcp_path.read_text())
          mcp["dependencies"]["@modelcontextprotocol/sdk"] = "1.29.0"
          mcp_path.write_text(json.dumps(mcp, indent=2) + "\n")

          root_path = Path("package.json")
          root = json.loads(root_path.read_text())
          root["dependencies"].pop("fast-uri", None)
          root.setdefault("overrides", {})["fast-uri"] = "3.1.4"
          root["overrides"]["@hono/node-server"] = "2.0.11"
          root["overrides"]["tar"] = "7.5.22"
          root_path.write_text(json.dumps(root, indent=2) + "\n")
          PY
          rm -rf node_modules package-lock.json
          npm install --package-lock-only
          npm ci
      - run: npm run pw:install
      - name: Capture each validation gate independently
        shell: bash
        run: |
          mkdir -p dependency-diagnostics
          set +e
          npm run format > dependency-diagnostics/format.log 2>&1
          echo "$?" > dependency-diagnostics/format.status
          set -e

          run_check() {
            local name="$1"
            shift
            set +e
            "$@" > "dependency-diagnostics/${name}.log" 2>&1
            local status=$?
            set -e
            echo "$status" > "dependency-diagnostics/${name}.status"
          }

          run_check format-check npm run format:check
          run_check typecheck npm run typecheck
          run_check tests npm test
          run_check lint npm run lint
          run_check build npm run build
          run_check bench-internal npm run bench:internal
          run_check bench-learnloop npm run bench:learnloop
          run_check preflight npm run preflight
          run_check audit npm run audit:prod
          run_check docs npm run check:docs
          run_check release-versions npm run check:release-versions
          run_check secrets npm run scan:secrets
          run_check agentlab bash -lc 'PYTHONPATH=benchmarks/agentlab python -m unittest discover -s benchmarks/agentlab/tests'
          run_check game-training-python python packages/game-training/python/test_worker.py
          run_check python-compile python -m py_compile benchmarks/agentlab/lhic_semantic_policy.py benchmarks/agentlab/lhic_agent.py benchmarks/agentlab/preflight.py benchmarks/agentlab/run_study.py

          git diff --binary > dependency-diagnostics/candidate.patch
          cp package.json dependency-diagnostics/root-package.json
          cp package-lock.json dependency-diagnostics/package-lock.json
          cp packages/controller/package.json dependency-diagnostics/controller-package.json
          cp apps/mcp-server/package.json dependency-diagnostics/mcp-server-package.json
          for status_file in dependency-diagnostics/*.status; do
            printf '%s=' "$(basename "$status_file" .status)"
            cat "$status_file"
          done | sort > dependency-diagnostics/summary.txt
          cat dependency-diagnostics/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xtf-dependency-remediation-diagnostics
          path: dependency-diagnostics
          if-no-files-found: error
          retention-days: 1
