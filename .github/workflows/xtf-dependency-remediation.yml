name: XTF one-shot production dependency remediation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Apply the reviewed minimum security remediation
        run: |
          git fetch --depth=1 origin 5a9096824245251dde43fea4921e71fc02f1499f
          git show 5a9096824245251dde43fea4921e71fc02f1499f:.github/workflows/xtf-dependency-remediation.yml > /tmp/original-remediation.yml
          python <<'PY'
          from pathlib import Path

          lines = Path("/tmp/original-remediation.yml").read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == "PY")
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines[start:end]
          ) + "\n"
          Path("/tmp/apply-remediation.py").write_text(script)
          PY
          python /tmp/apply-remediation.py
          python <<'PY'
          import json
          from pathlib import Path

          mcp_path = Path("apps/mcp-server/package.json")
          mcp = json.loads(mcp_path.read_text())
          mcp["dependencies"]["@modelcontextprotocol/sdk"] = "1.29.0"
          mcp_path.write_text(json.dumps(mcp, indent=2) + "\n")

          root_path = Path("package.json")
          root = json.loads(root_path.read_text())
          root["dependencies"].pop("@hono/node-server", None)
          root["dependencies"]["fast-uri"] = "3.1.4"
          root["dependencies"]["tar"] = "7.5.22"
          overrides = root.setdefault("overrides", {})
          overrides.pop("@hono/node-server", None)
          overrides.pop("@modelcontextprotocol/sdk@1.29.0", None)
          overrides["fast-uri"] = "$fast-uri"
          overrides["tar"] = "$tar"
          root_path.write_text(json.dumps(root, indent=2) + "\n")
          PY
          npm install --package-lock-only
          npm ci
      - run: npm run pw:install
      - name: Validate full repository and production dependency boundary
        run: |
          npx prettier --write \
            package.json \
            apps/mcp-server/package.json \
            apps/mcp-server/src/index.ts \
            apps/cli/src/interactive-demo.ts \
            packages/controller/package.json \
            packages/controller/src/demo-learning.ts \
            packages/controller/src/demo-learning.test.ts
          npm run format:check
          npm run typecheck
          npm test
          npm run lint
          npm run build
          npm run bench:internal
          npm run bench:learnloop
          npm run preflight
          npm run audit:prod
          npm audit --omit=dev --json > /tmp/production-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/production-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          if ((counts.high ?? 0) !== 0 || (counts.critical ?? 0) !== 0) {
            throw new Error(`Production audit still has high=${counts.high ?? 0}, critical=${counts.critical ?? 0}.`);
          }
          console.log(JSON.stringify(counts));
          NODE
          npm run check:docs
          npm run check:release-versions
          npm run scan:secrets
          npm run package:smoke
          npm run package:alias-smoke
          PYTHONPATH=benchmarks/agentlab python -m unittest discover -s benchmarks/agentlab/tests
          python packages/game-training/python/test_worker.py
          python -m py_compile benchmarks/agentlab/lhic_semantic_policy.py benchmarks/agentlab/lhic_agent.py benchmarks/agentlab/preflight.py benchmarks/agentlab/run_study.py
      - name: Commit validated code and lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            package-lock.json \
            packages/controller/package.json \
            packages/controller/src/demo-learning.ts \
            packages/controller/src/demo-learning.test.ts \
            apps/cli/src/interactive-demo.ts \
            apps/mcp-server/package.json \
            apps/mcp-server/src/index.ts
          git commit -m "security(xtf): remove vulnerable production dependency chains"
          git pull --rebase origin xtf/lhic-learnloop
          git push origin HEAD:xtf/lhic-learnloop
