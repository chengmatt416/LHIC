name: XTF blinded labeling gate

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/cli/src/learnloop-study-labeling*"
      - "apps/cli/src/entry.ts"
      - "benchmarks/learnloop-study/**"
      - "docs/xtf-study-preregistration.md"
      - "XTF-LEARNLOOP.md"
      - ".github/workflows/xtf-labeling-finalize.yml"
  push:
    branches: [xtf/lhic-learnloop]

permissions:
  contents: read

env:
  CI: true

jobs:
  blinded-labeling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check repository formatting
        run: npm run format:check
      - name: Typecheck project references
        run: npm run typecheck
      - name: Test blinded labeling invariants
        run: npx vitest run apps/cli/src/learnloop-study-labeling.test.ts
      - name: Validate public labeling CLI
        run: npx tsx apps/cli/src/entry.ts help | grep -F "finalize-labels"
      - name: Lint repository
        run: npm run lint
