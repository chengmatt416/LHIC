name: XTF final dependency and runtime commit v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Extract and correct the reviewed finalizer scripts
        run: |
          python <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/xtf-finalize-dependencies.yml').read_text().splitlines()
          blocks = []
          index = 0
          while index < len(lines):
              if "node <<'NODE'" not in lines[index]:
                  index += 1
                  continue
              start = index + 1
              end = next(
                  candidate
                  for candidate in range(start, len(lines))
                  if lines[candidate].strip() == 'NODE'
              )
              blocks.append(
                  '\n'.join(
                      line[10:] if line.startswith('          ') else line
                      for line in lines[start:end]
                  ) + '\n'
              )
              index = end + 1

          if len(blocks) != 2:
              raise RuntimeError(f'Expected two Node blocks, found {len(blocks)}.')

          patch = blocks[0].replace(
              r"\\`@huggingface/transformers\\`",
              "'@huggingface/transformers'",
          )
          Path('/tmp/xtf-final-patch.js').write_text(patch)

          commit = blocks[1].replace(
              '                path !== ".github/workflows/xtf-finalize-dependencies.yml",',
              '                path !== ".github/workflows/xtf-finalize-dependencies.yml" &&\n'
              '                path !== ".github/workflows/xtf-finalize-dependencies-v2.yml",',
          )
          commit = commit.replace(
              '              ".github/workflows/xtf-finalize-dependencies.yml",\n',
              '              ".github/workflows/xtf-finalize-dependencies.yml",\n'
              '              ".github/workflows/xtf-finalize-dependencies-v2.yml",\n',
          )
          Path('/tmp/xtf-final-commit.js').write_text(commit)
          PY
          node /tmp/xtf-final-patch.js
      - name: Resolve a clean production dependency graph
        run: |
          SAFE_TAR_VERSION="$(npm view tar version)"
          npm pkg set "overrides.tar=${SAFE_TAR_VERSION}"
          npm install --package-lock-only
          npm audit fix --package-lock-only --omit=dev || true
          npm ci
          npm audit --omit=dev --audit-level=moderate
      - run: npm run pw:install
      - name: Format and validate the complete repository
        run: |
          npm run format
          npm run format:check
          npm run typecheck
          npm test
          npm run lint
          npm run build
          npm run bench:internal
          npm run bench:learnloop
          npm run preflight
          npm run audit:prod
          npm run check:docs
          npm run check:release-versions
          npm run scan:secrets
          PYTHONPATH=benchmarks/agentlab python -m unittest discover -s benchmarks/agentlab/tests
          python packages/game-training/python/test_worker.py
          python -m py_compile benchmarks/agentlab/lhic_semantic_policy.py benchmarks/agentlab/lhic_agent.py benchmarks/agentlab/preflight.py benchmarks/agentlab/run_study.py
      - name: Create the validated Git commit object
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node /tmp/xtf-final-commit.js
      - uses: actions/upload-artifact@v4
        with:
          name: xtf-validated-final-commit-v2
          path: validated-final-commit.json
          if-no-files-found: error
          retention-days: 1
