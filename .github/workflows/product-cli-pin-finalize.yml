name: Finalize reproducible CLI self-install

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/product-cli-pin-finalize.yml"

permissions:
  contents: write

env:
  CI: true

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply exact-version CLI installation
        run: |
          python scripts/product-cli-pin-preflight.py
          python scripts/product-cli-pin-finalize.py
      - name: Revalidate product changes
        run: |
          npm run format:check
          npm run typecheck
          npx vitest run apps/cli/src/installer.test.ts apps/cli/src/product-data.test.ts apps/cli/src/user-experience.test.ts
          npm run package:smoke
          npm run lint
      - name: Commit validated non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/product-cli-pin-preflight.py
          git rm -f scripts/product-cli-pin-finalize.py
          git add apps/cli/src/installer.ts apps/cli/src/installer.test.ts README.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(product): pin CLI self-install version"
          git pull --rebase origin xtf/lhic-learnloop
          git push origin HEAD:xtf/lhic-learnloop
