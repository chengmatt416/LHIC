name: Diagnose reproducible CLI self-install finalization

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/product-cli-pin-finalize.yml"

permissions:
  contents: write

env:
  CI: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply and revalidate exact-version installation
        run: |
          python scripts/product-cli-pin-preflight.py
          python scripts/product-cli-pin-finalize.py
          npm run format:check
          npm run typecheck
          npx vitest run apps/cli/src/installer.test.ts apps/cli/src/product-data.test.ts apps/cli/src/user-experience.test.ts
          npm run package:smoke
          npm run lint
      - name: Record Git finalization commands
        shell: bash
        run: |
          set +e
          exec > >(tee cli-pin-git-diagnostic.log) 2>&1
          run_command() {
            echo
            echo "### $*"
            "$@"
            status=$?
            echo "exit=$status"
            return 0
          }
          run_command git status --short
          run_command git rm scripts/product-cli-pin-preflight.py
          run_command git rm scripts/product-cli-pin-finalize.py
          run_command git add apps/cli/src/installer.ts apps/cli/src/installer.test.ts README.md
          run_command git diff --cached --check
          run_command git diff --cached --stat
          run_command git config user.name github-actions-bot
          run_command git config user.email 41898282+github-actions-bot@users.noreply.github.com
          run_command git commit -m "fix(product): pin CLI self-install version"
          run_command git status --short
          run_command git pull --rebase origin xtf/lhic-learnloop
          run_command git push --dry-run origin HEAD:xtf/lhic-learnloop
      - name: Upload Git diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-pin-git-diagnostic
          path: cli-pin-git-diagnostic.log
          if-no-files-found: error
          retention-days: 1
      - name: Stop after diagnostic
        run: exit 1
