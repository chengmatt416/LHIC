name: Diagnose reproducible CLI self-install

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/product-cli-pin-finalize.yml"

permissions:
  contents: read

env:
  CI: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply and validate exact-version installation
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python scripts/product-cli-pin-preflight.py
            python scripts/product-cli-pin-finalize.py
          } > cli-pin-diagnostic.log 2>&1
      - name: Upload CLI pin diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-pin-diagnostic
          path: cli-pin-diagnostic.log
          if-no-files-found: error
          retention-days: 1
      - name: Require successful application
        if: steps.apply.outcome != 'success'
        run: |
          cat cli-pin-diagnostic.log
          exit 1
