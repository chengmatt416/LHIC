name: Finalize safe uninstall lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/product-uninstall-finalize.yml"

permissions:
  contents: write

env:
  CI: true

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply and validate safe uninstall lifecycle
        run: |
          python scripts/product-uninstall-preflight.py
          python scripts/product-uninstall-finalize.py
          npm run format:check
          npm run check:product-readiness
      - name: Commit validated non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/product-uninstall-preflight.py
          git rm scripts/product-uninstall-finalize.py
          git add apps/cli/src/uninstaller.ts apps/cli/src/uninstaller.test.ts apps/cli/src/main.ts apps/cli/src/interactive.ts README.md docs/uninstall.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(product): add safe uninstall lifecycle"
          git pull --rebase origin xtf/lhic-learnloop
          git push origin HEAD:xtf/lhic-learnloop
