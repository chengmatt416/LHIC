name: Public Harness Probe

on:
  push:
    branches:
      - research/lhic-core-academic
    paths:
      - 'experiments/public-harness-comparator/**'
      - '.github/workflows/public-harness-probe.yml'

jobs:
  codex-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Codex CLI 0.147.0
        run: |
          npm install -g @openai/codex@0.147.0
          codex --version | tee codex-version.txt
      - name: Run Codex against local deterministic provider
        shell: bash
        run: |
          set -u
          mkdir -p artifacts/public-harness-probe /tmp/codex-home
          cat > /tmp/codex-home/config.toml <<'EOF'
          model = "gpt-5.2"
          model_provider = "lhic_mock"
          approval_policy = "never"
          sandbox_mode = "danger-full-access"

          [model_providers.lhic_mock]
          name = "LHIC deterministic local mock"
          base_url = "http://127.0.0.1:8765/v1"
          wire_api = "responses"
          request_max_retries = 0
          stream_max_retries = 0
          requires_openai_auth = false
          EOF
          python3 experiments/public-harness-comparator/mock_provider.py --port 8765 --log artifacts/public-harness-probe/codex-provider.jsonl >artifacts/public-harness-probe/codex-server.log 2>&1 &
          SERVER_PID=$!
          sleep 1
          set +e
          CODEX_HOME=/tmp/codex-home codex exec --skip-git-repo-check --ephemeral --json "Reply exactly PROBE_OK and do not use tools." >artifacts/public-harness-probe/codex-output.jsonl 2>artifacts/public-harness-probe/codex-stderr.log
          RC=$?
          set -e
          kill $SERVER_PID || true
          wait $SERVER_PID 2>/dev/null || true
          python3 - <<PY
          import json
          from pathlib import Path
          out = Path('artifacts/public-harness-probe/codex-output.jsonl').read_text(errors='replace')
          req = Path('artifacts/public-harness-probe/codex-provider.jsonl').read_text(errors='replace') if Path('artifacts/public-harness-probe/codex-provider.jsonl').exists() else ''
          result = {'harness':'codex','version':'0.147.0','exitCode':int('$RC'),'providerRequests':len([x for x in req.splitlines() if x.strip()]),'probeOk':'PROBE_OK' in out}
          Path('artifacts/public-harness-probe/codex-result.json').write_text(json.dumps(result, indent=2))
          print(result)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-harness-probe-codex
          path: |
            artifacts/public-harness-probe/codex-*
            codex-version.txt
          if-no-files-found: error

  goose-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Goose 1.46.0 release CLI
        shell: bash
        run: |
          curl -fsSL https://github.com/aaif-goose/goose/releases/download/v1.46.0/download_cli.sh -o /tmp/download_goose.sh
          bash /tmp/download_goose.sh
          GOOSE_BIN=$(command -v goose || find "$HOME" -type f -name goose -perm -111 2>/dev/null | head -1)
          test -n "$GOOSE_BIN"
          echo "GOOSE_BIN=$GOOSE_BIN" >> "$GITHUB_ENV"
          "$GOOSE_BIN" --version | tee goose-version.txt
      - name: Run Goose against local deterministic provider
        shell: bash
        run: |
          set -u
          mkdir -p artifacts/public-harness-probe
          python3 experiments/public-harness-comparator/mock_provider.py --port 8765 --log artifacts/public-harness-probe/goose-provider.jsonl >artifacts/public-harness-probe/goose-server.log 2>&1 &
          SERVER_PID=$!
          sleep 1
          set +e
          GOOSE_PROVIDER=openai \
          GOOSE_MODEL=gpt-5.2 \
          GOOSE_MODE=auto \
          GOOSE_MAX_TURNS=3 \
          GOOSE_DISABLE_SESSION_NAMING=true \
          GOOSE_TELEMETRY_ENABLED=false \
          OPENAI_BASE_URL=http://127.0.0.1:8765/v1 \
          "$GOOSE_BIN" run --no-session --no-profile -t "Reply exactly PROBE_OK and do not use tools." >artifacts/public-harness-probe/goose-output.log 2>artifacts/public-harness-probe/goose-stderr.log
          RC=$?
          set -e
          kill $SERVER_PID || true
          wait $SERVER_PID 2>/dev/null || true
          python3 - <<PY
          import json
          from pathlib import Path
          out = Path('artifacts/public-harness-probe/goose-output.log').read_text(errors='replace')
          req = Path('artifacts/public-harness-probe/goose-provider.jsonl').read_text(errors='replace') if Path('artifacts/public-harness-probe/goose-provider.jsonl').exists() else ''
          result = {'harness':'goose','version':'1.46.0','exitCode':int('$RC'),'providerRequests':len([x for x in req.splitlines() if x.strip()]),'probeOk':'PROBE_OK' in out}
          Path('artifacts/public-harness-probe/goose-result.json').write_text(json.dumps(result, indent=2))
          print(result)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-harness-probe-goose
          path: |
            artifacts/public-harness-probe/goose-*
            goose-version.txt
          if-no-files-found: error
