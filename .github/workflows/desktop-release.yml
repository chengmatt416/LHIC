name: Desktop Release

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

env:
  OMP_VERSION: 17.2.15

jobs:
  linux-x64:
    name: Linux x64 (AppImage/deb/rpm/zip + snap)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium and Linux system dependencies
        run: npx playwright install chromium --with-deps
      - name: Install snapcraft
        run: sudo snap install snapcraft --classic
      - name: Package Linux x64
        run: npm run desktop:package -- --x64
      - name: Package Linux x64 snap
        run: npm run package:snap
      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: apps/desktop/release/*

  linux-arm64:
    name: Linux arm64 (AppImage/deb/rpm/zip)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium and Linux system dependencies
        run: npx playwright install chromium --with-deps
      - name: Package Linux arm64
        run: npm run desktop:package -- --arm64
      - name: Upload Linux arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: apps/desktop/release/*

  macos-x64:
    name: macOS x64 (signed + notarized)
    runs-on: macos-13
    timeout-minutes: 60
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_NAME: ${{ secrets.CSC_NAME }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium and macOS system dependencies
        run: npx playwright install chromium --with-deps
      - name: Package macOS x64 (signed + notarized)
        if: ${{ env.CSC_LINK != '' && env.APPLE_API_KEY != '' }}
        run: npm run package:release -- --x64
      - name: Package macOS x64 (ad-hoc signed)
        if: ${{ env.CSC_LINK == '' || env.APPLE_API_KEY == '' }}
        run: npm run desktop:package -- --x64
      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: apps/desktop/release/*

  macos-arm64:
    name: macOS arm64 (signed + notarized)
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_NAME: ${{ secrets.CSC_NAME }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium and macOS system dependencies
        run: npx playwright install chromium --with-deps
      - name: Package macOS arm64 (signed + notarized)
        if: ${{ env.CSC_LINK != '' && env.APPLE_API_KEY != '' }}
        run: npm run package:release -- --arm64
      - name: Package macOS arm64 (ad-hoc signed)
        if: ${{ env.CSC_LINK == '' || env.APPLE_API_KEY == '' }}
        run: npm run desktop:package -- --arm64
      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: apps/desktop/release/*

  windows-x64:
    name: Windows x64 (NSIS)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Sign only when the code-signing secrets are configured; otherwise the
      # NSIS installer is produced unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium and Windows system dependencies
        run: npx playwright install chromium --with-deps
      - name: Package Windows x64
        shell: bash
        run: npm run desktop:package -- --x64
      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: apps/desktop/release/*

  release:
    name: Assemble release + checksums
    needs: [linux-x64, linux-arm64, macos-x64, macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve release version
        id: release-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "version=${RELEASE_TAG#desktop-v}" >> "$GITHUB_OUTPUT"
      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 manifest
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: node scripts/generate-sha256-manifest.mjs artifacts "$RELEASE_VERSION"
      - name: Bundle installers into the release
        run: |
          # The lhic.techtools.qzz.io redirect serves /install.sh and
          # /install.ps1 from releases/latest/download, so every desktop
          # release must carry them.
          cp scripts/install.sh artifacts/install.sh
          cp scripts/install.ps1 artifacts/install.ps1
      - name: Publish desktop release
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: gh release create "desktop-v${RELEASE_VERSION}" artifacts/* --generate-notes

  publish-channels:
    name: Publish npm / Homebrew / AUR
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
    env:
      OMP_VERSION: 17.2.15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Resolve release version
        id: release-version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "version=${RELEASE_TAG#desktop-v}" >> "$GITHUB_OUTPUT"
      - name: Check desktop / installer version coupling
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          desktop="$(node -p "require('./apps/desktop/package.json').version")"
          installer="$(node -p "require('./apps/desktop-installer/package.json').version")"
          test "$desktop" = "$installer" || { echo "desktop ($desktop) and lhic-desktop ($installer) versions differ"; exit 1; }
          test "$desktop" = "$RELEASE_VERSION" || { echo "release tag version ($RELEASE_VERSION) does not match desktop ($desktop)"; exit 1; }
      - name: Publish lhic-desktop to npm (also installable via Bun)
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --workspace lhic-desktop --access public --provenance
      - name: npm publish skipped (no NPM_TOKEN secret)
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: echo "npm publish skipped (NPM_TOKEN secret not configured)"
      - name: Publish Homebrew tap
        if: ${{ secrets.LHIC_BREW_TAP_TOKEN != '' }}
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          LHIC_BREW_TAP_REMOTE: "${{ secrets.LHIC_BREW_TAP_TOKEN != '' && format('https://x-access-token:{0}@github.com/chengmatt416/homebrew-lhic.git', secrets.LHIC_BREW_TAP_TOKEN) || 'git@github.com:chengmatt416/homebrew-lhic.git' }}"
        run: node scripts/publish-brew-tap.mjs "$RELEASE_VERSION" --push
      - name: Publish AUR package (paru/yay)
        if: ${{ secrets.LHIC_AUR_SSH_KEY != '' }}
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          LHIC_AUR_SSH_KEY: ${{ secrets.LHIC_AUR_SSH_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$LHIC_AUR_SSH_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o StrictHostKeyChecking=accept-new" \
            node scripts/publish-aur.mjs "$RELEASE_VERSION" --push
      - name: AUR publish skipped (no LHIC_AUR_SSH_KEY secret)
        if: ${{ secrets.LHIC_AUR_SSH_KEY == '' }}
        run: echo "AUR publish skipped (LHIC_AUR_SSH_KEY secret not configured)"
