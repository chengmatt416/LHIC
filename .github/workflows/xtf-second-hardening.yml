name: XTF second adversarial hardening

on:
  push:
    branches:
      - xtf/lhic-learnloop

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply origin scoping and atomic correction validation
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(source, before, after, label) {
            const first = source.indexOf(before);
            if (first < 0 || source.indexOf(before, first + before.length) >= 0) {
              throw new Error(`Expected exactly one ${label} insertion point.`);
            }
            return source.slice(0, first) + after + source.slice(first + before.length);
          }

          const sourceFile = 'packages/controller/src/human-intent-learnloop.ts';
          let source = fs.readFileSync(sourceFile, 'utf8');

          source = source.replaceAll('"lhic-learnloop-v2"', '"lhic-learnloop-v3"');
          source = replaceOnce(
            source,
            '  contextKey: string;\n  featureTokens: string[];',
            '  contextKey: string;\n  scopeSha256: string;\n  featureTokens: string[];',
            'rule scope field',
          );
          source = replaceOnce(
            source,
            'interface ContextFeatures {\n  key: string;\n  tokens: string[];\n  intentFingerprint: string;\n}',
            'interface ContextFeatures {\n  key: string;\n  scopeSha256: string;\n  tokens: string[];\n  intentFingerprint: string;\n}',
            'context scope field',
          );
          source = replaceOnce(
            source,
            '        rule.fromStage === input.predictedStage &&\n        rule.status !== "revoked" &&',
            '        rule.fromStage === input.predictedStage &&\n        rule.scopeSha256 === features.scopeSha256 &&\n        rule.status !== "revoked" &&',
            'training scope gate',
          );

          const prematureQuarantine = `    if (conflictingTargets.length > 0) {\n      for (const rule of related) {\n        this.rules.set(rule.id, {\n          ...rule,\n          status: "quarantined",\n          updatedAt: now,\n        });\n      }\n    }\n\n`;
          source = replaceOnce(
            source,
            prematureQuarantine,
            '',
            'premature quarantine block',
          );

          source = replaceOnce(
            source,
            `      validationUiFingerprints.add(input.provenance.uiFingerprint);\n    }\n\n    const conflict = conflictingTargets.length > 0;`,
            `      validationUiFingerprints.add(input.provenance.uiFingerprint);\n    }\n\n    if (conflictingTargets.length > 0) {\n      for (const rule of related) {\n        this.rules.set(rule.id, {\n          ...rule,\n          status: "quarantined",\n          updatedAt: now,\n        });\n      }\n    }\n\n    const conflict = conflictingTargets.length > 0;`,
            'post-validation quarantine block',
          );
          source = replaceOnce(
            source,
            '      contextKey: hashState(featureTokens),\n      featureTokens,',
            '      contextKey: hashState(featureTokens),\n      scopeSha256: features.scopeSha256,\n      featureTokens,',
            'rule scope assignment',
          );
          source = replaceOnce(
            source,
            '          rule.fromStage === base.predictedIntent &&\n          rule.status !== "revoked" &&',
            '          rule.fromStage === base.predictedIntent &&\n          rule.scopeSha256 === features.scopeSha256 &&\n          rule.status !== "revoked" &&',
            'application scope gate',
          );
          source = replaceOnce(
            source,
            '  const constraintTypes = constraintTypeHistogram(intent.constraints);\n  const tokens = [',
            '  const constraintTypes = constraintTypeHistogram(intent.constraints);\n  const scopeSha256 = contextScopeSha256(state);\n  const tokens = [',
            'scope derivation',
          );
          source = replaceOnce(
            source,
            '    key: hashState(tokens),\n    tokens,',
            '    key: hashState([scopeSha256, ...tokens]),\n    scopeSha256,\n    tokens,',
            'scoped context key',
          );
          source = replaceOnce(
            source,
            '\nfunction semanticHints(value: string): string[] {',
            `\nfunction contextScopeSha256(state: NormalizedUIState): string {\n  let scope = \`surface:\${state.surface}:unknown\`;\n  if (state.surface === "browser" && state.url) {\n    try {\n      scope = \`browser:\${new URL(state.url).origin}\`;\n    } catch {\n      scope = "browser:invalid-origin";\n    }\n  } else if (state.app) {\n    scope = \`\${state.surface}:app:\${state.app.slice(0, 256)}\`;\n  } else if (state.screenType) {\n    scope = \`\${state.surface}:screen:\${state.screenType.slice(0, 256)}\`;\n  }\n  return hashState(scope);\n}\n\nfunction semanticHints(value: string): string[] {`,
            'scope hash helper',
          );
          source = replaceOnce(
            source,
            '    assertSnapshot(envelope.snapshot, this.maximumRules);',
            `    assertSnapshot(\n      envelope.snapshot,\n      this.maximumRules,\n      this.minimumTrainingEvidence,\n      this.minimumValidationEvidence,\n    );`,
            'snapshot threshold validation call',
          );
          source = replaceOnce(
            source,
            `function assertSnapshot(\n  snapshot: LearnLoopSnapshot,\n  maximumRules: number,\n): void {`,
            `function assertSnapshot(\n  snapshot: LearnLoopSnapshot,\n  maximumRules: number,\n  minimumTrainingEvidence: number,\n  minimumValidationEvidence: number,\n): void {`,
            'snapshot validator signature',
          );
          source = replaceOnce(
            source,
            '    assertRule(rule);',
            '    assertRule(rule, minimumTrainingEvidence, minimumValidationEvidence);',
            'rule validator call',
          );
          source = replaceOnce(
            source,
            'function assertRule(rule: LearnLoopRule): void {',
            `function assertRule(\n  rule: LearnLoopRule,\n  minimumTrainingEvidence: number,\n  minimumValidationEvidence: number,\n): void {`,
            'rule validator signature',
          );
          source = replaceOnce(
            source,
            `    !rule.id.trim() ||\n    !/^[a-f0-9]{64}$/.test(rule.contextKey) ||\n    !controllerStages.has(rule.fromStage) ||\n    !controllerStages.has(rule.toStage) ||`,
            `    !/^[0-9a-f-]{36}$/.test(rule.id) ||\n    !/^[a-f0-9]{64}$/.test(rule.contextKey) ||\n    !/^[a-f0-9]{64}$/.test(rule.scopeSha256) ||\n    rule.contextKey !== hashState(rule.featureTokens) ||\n    !controllerStages.has(rule.fromStage) ||\n    !controllerStages.has(rule.toStage) ||\n    rule.fromStage === rule.toStage ||\n    !skillForStage[rule.toStage] ||\n    rule.skillName !== skillForStage[rule.toStage] ||`,
            'rule identity invariants',
          );
          source = replaceOnce(
            source,
            `    rule.featureTokens.length > 128 ||\n    !allUnique(rule.featureTokens) ||`,
            `    rule.featureTokens.length > 128 ||\n    !allUnique(rule.featureTokens) ||\n    rule.featureTokens.some(\n      (token) =>\n        typeof token !== "string" ||\n        token.length === 0 ||\n        token.length > 128 ||\n        /[\\u0000-\\u001f\\u007f]/.test(token),\n    ) ||\n    (rule.status === "active" &&\n      (rule.trainingTaskHashes.length < minimumTrainingEvidence ||\n        rule.validationUiFingerprints.length < minimumValidationEvidence)) ||`,
            'active evidence and token bounds',
          );

          fs.writeFileSync(sourceFile, source);

          const testFile = 'packages/controller/src/human-intent-learnloop.test.ts';
          let tests = fs.readFileSync(testFile, 'utf8');
          const testInsertion = `  it("supports explicit revocation without silently evicting active rules", () => {\n    const loop = new HumanIntentLearnLoop({ maximumRules: 1 });\n    const rule = trainAndValidateSearchRule(loop);\n    expect(loop.revokeRule(rule.id)).toBe(true);\n    expect(\n      loop.decide("revoked", searchIntent, ambiguousState).prediction\n        .predictedIntent,\n    ).toBe("login");\n  });\n`;
          const hardenedTests = `${testInsertion}\n  it("does not apply a learned correction across browser origins", () => {\n    const loop = new HumanIntentLearnLoop();\n    trainAndValidateSearchRule(loop);\n    const otherOrigin = {\n      ...ambiguousState,\n      url: "https://unrelated.example.test/workspace",\n      capturedAt: "2026-07-26T02:00:00.000Z",\n    };\n\n    const decision = loop.decide("other-origin", searchIntent, otherOrigin);\n    expect(decision.appliedRuleIds).toEqual([]);\n    expect(decision.prediction.predictedIntent).toBe("login");\n  });\n\n  it("does not mutate existing rules when rejected validation evidence throws", () => {\n    const loop = new HumanIntentLearnLoop();\n    trainAndValidateSearchRule(loop);\n    const before = loop.listRules();\n\n    expect(() =>\n      loop.recordCorrection({\n        ...correction("invalid-conflicting-validation", "validation", ambiguousState),\n        correctedStage: "download",\n      }),\n    ).toThrow("Validation evidence cannot create");\n    expect(loop.listRules()).toEqual(before);\n  });\n`;
          tests = replaceOnce(
            tests,
            testInsertion,
            hardenedTests,
            'second hardening tests',
          );
          fs.writeFileSync(testFile, tests);

          const reviewFile = 'docs/xtf-adversarial-review.md';
          let review = fs.readFileSync(reviewFile, 'utf8');
          const appendix = `\n## Second hostile-review pass\n\nA second independent pass found two additional high-severity issues after the first remediation:\n\n1. **Cross-origin rule bleed:** coarse semantic similarity could apply a correction learned on one website to a different website with a similar login/search layout. Rules are now bound to an exact SHA-256 scope derived from browser origin (or bounded app/screen context for non-browser surfaces). The raw origin or app name is not persisted in the snapshot.\n2. **Mutation before rejected validation:** a conflicting validation event with no matching candidate could quarantine existing rules before throwing. Conflict quarantine now occurs only after all validation-only rejection checks complete, and a regression test verifies state remains unchanged after the rejected call.\n\nSnapshot schema was advanced from v2 to v3. Import now also verifies scope hashes, context-key consistency, stage-to-skill binding, bounded feature tokens, and the configured training/validation evidence minimum for active rules. Older research snapshots must be retrained or migrated explicitly; they are not silently trusted.\n`;
          if (!review.includes('## Second hostile-review pass')) review += appendix;
          fs.writeFileSync(reviewFile, review);

          const overviewFile = 'XTF-LEARNLOOP.md';
          let overview = fs.readFileSync(overviewFile, 'utf8');
          overview = overview.replace(
            '- Learned rules are bounded, revocable, and local.',
            '- Learned rules are bounded, revocable, local, and exactly scoped to a hashed browser origin or non-browser app/screen context.',
          );
          fs.writeFileSync(overviewFile, overview);
          NODE
      - run: npm run format
      - run: npm run typecheck
      - run: npm test
      - name: Commit second hardening pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(xtf): scope learned intent rules and make validation atomic"
          git push origin HEAD:xtf/lhic-learnloop
