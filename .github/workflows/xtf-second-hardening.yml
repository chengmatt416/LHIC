name: XTF focused second hardening

on:
  push:
    branches: [xtf/lhic-learnloop]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch cross-origin bleed and rejected-validation mutation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'packages/controller/src/human-intent-learnloop.ts';
          let s = fs.readFileSync(file, 'utf8');
          const once = (before, after, label) => {
            const i = s.indexOf(before);
            if (i < 0 || s.indexOf(before, i + before.length) >= 0) {
              throw new Error(`Expected one ${label} match.`);
            }
            s = s.slice(0, i) + after + s.slice(i + before.length);
          };

          s = s.replaceAll('"lhic-learnloop-v2"', '"lhic-learnloop-v3"');
          once(
            '  contextKey: string;\n  featureTokens: string[];',
            '  contextKey: string;\n  scopeSha256: string;\n  featureTokens: string[];',
            'rule interface',
          );
          once(
            'interface ContextFeatures {\n  key: string;\n  tokens: string[];\n  intentFingerprint: string;\n}',
            'interface ContextFeatures {\n  key: string;\n  scopeSha256: string;\n  tokens: string[];\n  intentFingerprint: string;\n}',
            'context interface',
          );
          once(
            '        rule.fromStage === input.predictedStage &&\n        rule.status !== "revoked" &&',
            '        rule.fromStage === input.predictedStage &&\n        rule.scopeSha256 === features.scopeSha256 &&\n        rule.status !== "revoked" &&',
            'training scope gate',
          );
          once(
            `    if (conflictingTargets.length > 0) {\n      for (const rule of related) {\n        this.rules.set(rule.id, {\n          ...rule,\n          status: "quarantined",\n          updatedAt: now,\n        });\n      }\n    }\n\n`,
            '',
            'premature quarantine',
          );
          once(
            `      validationUiFingerprints.add(input.provenance.uiFingerprint);\n    }\n\n    const conflict = conflictingTargets.length > 0;`,
            `      validationUiFingerprints.add(input.provenance.uiFingerprint);\n    }\n\n    if (conflictingTargets.length > 0) {\n      for (const rule of related) {\n        this.rules.set(rule.id, {\n          ...rule,\n          status: "quarantined",\n          updatedAt: now,\n        });\n      }\n    }\n\n    const conflict = conflictingTargets.length > 0;`,
            'atomic quarantine',
          );
          once(
            '      contextKey: hashState(featureTokens),\n      featureTokens,',
            '      contextKey: hashState([features.scopeSha256, ...featureTokens]),\n      scopeSha256: features.scopeSha256,\n      featureTokens,',
            'scoped rule',
          );
          once(
            '          rule.fromStage === base.predictedIntent &&\n          rule.status !== "revoked" &&',
            '          rule.fromStage === base.predictedIntent &&\n          rule.scopeSha256 === features.scopeSha256 &&\n          rule.status !== "revoked" &&',
            'application scope gate',
          );
          once(
            '  const constraintTypes = constraintTypeHistogram(intent.constraints);\n  const tokens = [',
            '  const constraintTypes = constraintTypeHistogram(intent.constraints);\n  const scopeSha256 = contextScopeSha256(state);\n  const tokens = [',
            'scope derivation',
          );
          once(
            '    key: hashState(tokens),\n    tokens,',
            '    key: hashState([scopeSha256, ...tokens]),\n    scopeSha256,\n    tokens,',
            'scoped feature result',
          );
          once(
            '\nfunction semanticHints(value: string): string[] {',
            `\nfunction contextScopeSha256(state: NormalizedUIState): string {\n  let scope = \`surface:\${state.surface}:unknown\`;\n  if (state.surface === "browser" && state.url) {\n    try {\n      scope = \`browser:\${new URL(state.url).origin}\`;\n    } catch {\n      scope = "browser:invalid-origin";\n    }\n  } else if (state.app) {\n    scope = \`\${state.surface}:app:\${state.app.slice(0, 256)}\`;\n  } else if (state.screenType) {\n    scope = \`\${state.surface}:screen:\${state.screenType.slice(0, 256)}\`;\n  }\n  return hashState(scope);\n}\n\nfunction semanticHints(value: string): string[] {`,
            'scope helper',
          );
          once(
            `    !rule.id.trim() ||\n    !/^[a-f0-9]{64}$/.test(rule.contextKey) ||\n    !controllerStages.has(rule.fromStage) ||`,
            `    !rule.id.trim() ||\n    !/^[a-f0-9]{64}$/.test(rule.contextKey) ||\n    !/^[a-f0-9]{64}$/.test(rule.scopeSha256) ||\n    rule.contextKey !== hashState([rule.scopeSha256, ...rule.featureTokens]) ||\n    !controllerStages.has(rule.fromStage) ||`,
            'snapshot scope validation',
          );
          fs.writeFileSync(file, s);

          const testFile = 'packages/controller/src/human-intent-learnloop.test.ts';
          let t = fs.readFileSync(testFile, 'utf8');
          const marker = `  it("supports explicit revocation without silently evicting active rules", () => {\n    const loop = new HumanIntentLearnLoop({ maximumRules: 1 });\n    const rule = trainAndValidateSearchRule(loop);\n    expect(loop.revokeRule(rule.id)).toBe(true);\n    expect(\n      loop.decide("revoked", searchIntent, ambiguousState).prediction\n        .predictedIntent,\n    ).toBe("login");\n  });\n`;
          if (!t.includes(marker)) throw new Error('Test insertion point missing.');
          t = t.replace(
            marker,
            `${marker}\n  it("does not apply a learned correction across browser origins", () => {\n    const loop = new HumanIntentLearnLoop();\n    trainAndValidateSearchRule(loop);\n    const decision = loop.decide("other-origin", searchIntent, {\n      ...ambiguousState,\n      url: "https://unrelated.example.test/workspace",\n      capturedAt: "2026-07-26T02:00:00.000Z",\n    });\n    expect(decision.appliedRuleIds).toEqual([]);\n    expect(decision.prediction.predictedIntent).toBe("login");\n  });\n\n  it("does not mutate rules when rejected validation throws", () => {\n    const loop = new HumanIntentLearnLoop();\n    trainAndValidateSearchRule(loop);\n    const before = loop.listRules();\n    expect(() =>\n      loop.recordCorrection({\n        ...correction("invalid-conflicting-validation", "validation", ambiguousState),\n        correctedStage: "download",\n      }),\n    ).toThrow("Validation evidence cannot create");\n    expect(loop.listRules()).toEqual(before);\n  });\n`,
          );
          fs.writeFileSync(testFile, t);

          const reviewFile = 'docs/xtf-adversarial-review.md';
          let review = fs.readFileSync(reviewFile, 'utf8');
          if (!review.includes('## Second hostile-review pass')) {
            review += `\n## Second hostile-review pass\n\nA second independent pass found two additional high-severity issues:\n\n1. **Cross-origin rule bleed:** a correction learned on one browser origin could match a similar UI on another origin. Rules are now bound to an exact SHA-256 context scope; raw origins and app names are not persisted.\n2. **Mutation before rejected validation:** an invalid conflicting validation event could quarantine existing rules before throwing. Quarantine now occurs only after validation-only rejection checks complete, and a regression test proves rejected calls leave state unchanged.\n\nThe signed snapshot schema is now v3 and rejects missing or inconsistent scope bindings. Older research snapshots are not silently trusted.\n`;
          }
          fs.writeFileSync(reviewFile, review);
          NODE
      - run: npm run format
      - run: npm run typecheck
      - run: npx vitest run packages/controller/src/human-intent-learnloop.test.ts packages/controller/src/prediction-first-human-intent-controller.test.ts
      - name: Commit focused hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(xtf): scope learned intent rules and make validation atomic"
          git push origin HEAD:xtf/lhic-learnloop
