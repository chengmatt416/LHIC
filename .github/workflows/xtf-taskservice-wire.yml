name: XTF one-shot TaskService wiring

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wire live Human Intent admission into TaskService
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, before: str, after: str) -> None:
              file = Path(path)
              source = file.read_text()
              if source.count(before) != 1:
                  raise RuntimeError(f"Expected exactly one match in {path}: {before[:120]!r}")
              file.write_text(source.replace(before, after, 1))

          service = "apps/desktop/src/main/task-service.ts"
          replace_once(
              service,
              'import { compileLocalFastPath } from "./fast-path-planner.js";',
              'import { compileLocalFastPath } from "./fast-path-planner.js";\nimport { DesktopHumanIntentAdmission } from "./prediction-first-browser-admission.js";',
          )
          replace_once(
              service,
              '''interface TaskServiceOptions {
            sourceStore?: Pick<TaskSourceStore, "load" | "save">;
            journalStore?: Pick<TaskJournalStore, "load" | "save">;
            sourceBudget?: () => TaskBudgetTracker;
          }''',
              '''type BrowserRunner = Pick<
            DesktopBrowserRunner,
            "approve" | "cancel" | "close" | "execute" | "readiness"
          >;

          interface TaskServiceOptions {
            sourceStore?: Pick<TaskSourceStore, "load" | "save">;
            journalStore?: Pick<TaskJournalStore, "load" | "save">;
            sourceBudget?: () => TaskBudgetTracker;
            browserRunner?: BrowserRunner;
            humanIntentAdmission?: DesktopHumanIntentAdmission;
          }''',
          )
          replace_once(
              service,
              '''  private readonly browserRunner: DesktopBrowserRunner;
            private readonly globalRunner: DesktopGlobalRunner;''',
              '''  private readonly browserRunner: BrowserRunner;
            private readonly globalRunner: DesktopGlobalRunner;
            private readonly humanIntentAdmission: DesktopHumanIntentAdmission;''',
          )
          replace_once(
              service,
              '''    this.browserRunner = new DesktopBrowserRunner(workspaceRoot);
            this.globalRunner = new DesktopGlobalRunner(workspaceRoot);''',
              '''    this.browserRunner =
              options.browserRunner ?? new DesktopBrowserRunner(workspaceRoot);
            this.globalRunner = new DesktopGlobalRunner(workspaceRoot);
            this.humanIntentAdmission =
              options.humanIntentAdmission ?? new DesktopHumanIntentAdmission();''',
          )
          replace_once(
              service,
              '''        message:
                  "A deterministic local Fast Path was compiled. It has not executed; start the browser session to continue through the normal approval and verifier gates.",''',
              '''        message:
                  "A deterministic local Fast Path candidate was compiled. It has not executed; the browser will observe the live target UI and run Human Intent admission before mutable task actions.",''',
          )
          replace_once(
              service,
              '''          "Fast Path compiled locally with zero LLM calls and zero MCP calls.",
                  `Compiled ${plan.steps.length} browser steps with verifier conditions.`,''',
              '''          "Fast Path compiled locally with zero LLM calls and zero MCP calls.",
                  "Live normalized UI and prediction-first admission are required after the fixed low-risk start URL bootstrap.",
                  `Compiled ${plan.steps.length} browser steps with verifier conditions.`,''',
          )
          replace_once(
              service,
              '''      this.pending.set(event.commandId, {
                goal: input.goal,
                phase: "execution",
                plan,
              });''',
              '''      this.pending.set(event.commandId, {
                goal: input.goal,
                ...(startUrl ? { startUrl } : {}),
                phase: "execution",
                plan,
              });''',
          )
          replace_once(
              service,
              '''        ? this.recordBrowserResult(
                    commandId,
                    await this.browserRunner.execute(commandId, plan),
                  )''',
              '''        ? this.recordBrowserResult(
                    commandId,
                    await this.browserRunner.execute(
                      commandId,
                      plan,
                      !pending.source && plan.skillName
                        ? (uiState) =>
                            this.humanIntentAdmission.evaluate(
                              commandId,
                              pending.goal,
                              plan,
                              uiState,
                            )
                        : undefined,
                    ),
                  )''',
          )
          replace_once(
              service,
              '''    if (result.status === "completed" || result.status === "failed") {
              this.pending.delete(commandId);''',
              '''    if (
              result.status === "blocked" ||
              result.status === "completed" ||
              result.status === "failed"
            ) {
              this.pending.delete(commandId);''',
          )

          test = "apps/desktop/src/main/task-service-learnloop.test.ts"
          replace_once(
              test,
              'import type { NormalizedUIState } from "@lhic/schema";',
              '''import type {
            BrowserExecutionPlan,
            NormalizedUIState,
          } from "@lhic/schema";''',
          )
          replace_once(
              test,
              '      plan: Parameters<BrowserIntentAdmission>[2],',
              '      plan: BrowserExecutionPlan,',
          )

          gate = ".github/workflows/xtf-learnloop.yml"
          replace_once(
              gate,
              '''      - "apps/cli/src/entry.ts"
                - "XTF-LEARNLOOP.md"''',
              '''      - "apps/cli/src/entry.ts"
                - "apps/desktop/src/main/desktop-browser-runner.ts"
                - "apps/desktop/src/main/prediction-first-browser-admission*"
                - "apps/desktop/src/main/task-service.ts"
                - "apps/desktop/src/main/task-service-learnloop.test.ts"
                - "XTF-LEARNLOOP.md"''',
          )
          replace_once(
              gate,
              '''          apps/cli/src/learnloop-benchmark.test.ts''',
              '''          apps/cli/src/learnloop-benchmark.test.ts
                    apps/desktop/src/main/prediction-first-browser-admission.test.ts
                    apps/desktop/src/main/task-service-learnloop.test.ts''',
          )
          PY
      - name: Verify production wiring
        run: |
          npx prettier --write \
            apps/desktop/src/main/task-service.ts \
            apps/desktop/src/main/task-service-learnloop.test.ts \
            .github/workflows/xtf-learnloop.yml
          npm run format:check
          npm run typecheck
          npx vitest run \
            packages/controller/src/human-intent-learnloop.test.ts \
            packages/controller/src/prediction-first-human-intent-controller.test.ts \
            apps/desktop/src/main/prediction-first-browser-admission.test.ts \
            apps/desktop/src/main/task-service-learnloop.test.ts
      - name: Commit verified wiring and remove temporary files
        run: |
          git rm .github/workflows/xtf-taskservice-wire.yml
          git rm -f .xtf-runtime-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat(xtf): enforce live intent admission in TaskService"
          git push origin HEAD:xtf/lhic-learnloop
