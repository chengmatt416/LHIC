name: XTF one-shot drift fix

on:
  push:
    branches:
      - xtf/lhic-learnloop

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - name: Make stable-intent prediction changes blocking
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'packages/controller/src/human-intent-learnloop.ts';
          let source = fs.readFileSync(file, 'utf8');
          const before = `      score += 0.45;\n      reasons.push(\n        "Predicted intent changed while the human-intent fingerprint stayed stable.",\n      );`;
          const after = `      score += 0.6;\n      reasons.push(\n        "Predicted intent changed while the human-intent fingerprint stayed stable.",\n      );`;
          if (!source.includes(before)) throw new Error('Expected drift block not found.');
          source = source.replace(before, after);
          fs.writeFileSync(file, source);
          NODE
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/controller/src/human-intent-learnloop.ts
          git commit -m "fix(xtf): block stable-intent prediction changes"
          git push origin HEAD:xtf/lhic-learnloop
