name: XTF correction formatting apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          packages/controller/src/trusted-correction-ingestion.ts
          packages/controller/src/trusted-correction-ingestion.test.ts
          packages/controller/src/index.ts
          .github/workflows/xtf-learnloop.yml
      - run: npm run format:check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/controller/src/trusted-correction-ingestion.ts \
            packages/controller/src/trusted-correction-ingestion.test.ts \
            packages/controller/src/index.ts \
            .github/workflows/xtf-learnloop.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(xtf): format trusted correction ingestion"
          git pull --rebase origin xtf/lhic-learnloop
          git push origin HEAD:xtf/lhic-learnloop
