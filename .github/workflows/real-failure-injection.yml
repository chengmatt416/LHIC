name: Real Failure Injection

on:
  workflow_dispatch:
  push:
    branches:
      - research/lhic-core-academic
    paths:
      - "src/**"
      - "experiments/real/**"
      - "package.json"
      - ".github/workflows/real-failure-injection.yml"
      - "docs/research/real-failure-injection.md"
      - "docs/research/failure-matrix.md"
      - "docs/research/randomized-cross-surface.md"

jobs:
  browser-desktop-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Flagship: 10 trials per surface = 30 post-commit crash trials.
      LHIC_REAL_TRIALS: "10"
      # Randomized layer: 3 trials x 6 modes x 3 surfaces = 54 trials per seed.
      LHIC_CAMPAIGN_TRIALS: "3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install desktop experiment dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool python3-tk git

      - name: Install pinned Playwright library
        run: npm install --no-save --ignore-scripts playwright@1.62.1

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run core invariant tests
        run: npm test

      - name: Run flagship real-surface suite and semantic matrix
        run: npm run experiment:real

      - name: Run randomized campaign seed A
        env:
          LHIC_CAMPAIGN_SEED: "2026-08-15"
        run: |
          npm run experiment:randomized
          mv artifacts/randomized-cross-surface-results.json artifacts/randomized-cross-surface-seed-a.json

      - name: Run randomized campaign seed B
        env:
          LHIC_CAMPAIGN_SEED: "2026-08-16"
        run: |
          npm run experiment:randomized
          mv artifacts/randomized-cross-surface-results.json artifacts/randomized-cross-surface-seed-b.json

      - name: Upload real experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhic-real-failure-injection
          path: artifacts/*.json
          if-no-files-found: error
