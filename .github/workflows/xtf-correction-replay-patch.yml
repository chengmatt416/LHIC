name: XTF correction replay patch diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Count exact patch preconditions
        run: |
          mkdir -p patch-diagnostics
          python <<'PY' > patch-diagnostics/counts.txt
          from pathlib import Path

          checks = [
              ("trusted-import", "packages/controller/src/trusted-correction-ingestion.ts", 'import type { HumanIntentLearnLoop } from "./human-intent-learnloop.js";\n'),
              ("trusted-options", "packages/controller/src/trusted-correction-ingestion.ts", '''export interface TrustedCorrectionIngestionOptions {
            publicKey: KeyLike;
            now?: () => Date;
            maximumConsumedApprovals?: number;
            isApprovalRevoked?: (approvalId: string) => boolean;
          }
          '''),
              ("trusted-fields", "packages/controller/src/trusted-correction-ingestion.ts", '''  private readonly now: () => Date;
            private readonly maximumConsumedApprovals: number;
            private readonly isApprovalRevoked: (approvalId: string) => boolean;
            private readonly consumedApprovalIds = new Map<string, number>();
            private readonly consumedNonces = new Map<string, number>();
          '''),
              ("trusted-constructor", "packages/controller/src/trusted-correction-ingestion.ts", '''    this.now = options.now ?? (() => new Date());
              this.maximumConsumedApprovals = boundedInteger(
                options.maximumConsumedApprovals ?? 4_096,
                1,
                100_000,
                "maximumConsumedApprovals",
              );
              this.isApprovalRevoked = options.isApprovalRevoked ?? (() => false);
          '''),
              ("trusted-prune-call", "packages/controller/src/trusted-correction-ingestion.ts", '    this.pruneExpired(now.getTime());\n\n'),
              ("index-export", "packages/controller/src/index.ts", 'export * from "./human-intent-learnloop.js";\n'),
              ("test-import", "packages/controller/src/trusted-correction-ingestion.test.ts", 'import { HumanIntentLearnLoop } from "./human-intent-learnloop.js";\n'),
              ("desktop-import", "apps/desktop/src/main/prediction-first-browser-admission.test.ts", '''  HumanIntentLearnLoop,
            TrustedHumanIntentCorrectionIngestion,
          '''),
              ("workflow-path", ".github/workflows/xtf-learnloop.yml", '      - "packages/controller/src/trusted-correction-ingestion*"\n'),
              ("workflow-test", ".github/workflows/xtf-learnloop.yml", '          packages/controller/src/trusted-correction-ingestion.test.ts\n'),
          ]
          for name, path, pattern in checks:
              print(f"{name}={Path(path).read_text().count(pattern)}")
          PY
          cat patch-diagnostics/counts.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xtf-correction-replay-preconditions
          path: patch-diagnostics/counts.txt
          retention-days: 1
