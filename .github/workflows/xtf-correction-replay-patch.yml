name: XTF persistent correction replay patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require an explicit atomic replay store
        run: |
          python <<'PY'
          import re
          from pathlib import Path

          def replace_once(path: str, before: str, after: str) -> None:
              file = Path(path)
              source = file.read_text()
              if source.count(before) != 1:
                  raise RuntimeError(f"Expected one match in {path}: {before[:120]!r}")
              file.write_text(source.replace(before, after, 1))

          def replace_regex(path: str, pattern: str, after: str) -> None:
              file = Path(path)
              source = file.read_text()
              updated, count = re.subn(pattern, after, source, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"Expected one regex match in {path}: {pattern[:120]!r}")
              file.write_text(updated)

          trusted = "packages/controller/src/trusted-correction-ingestion.ts"
          replace_once(
              trusted,
              'import type { HumanIntentLearnLoop } from "./human-intent-learnloop.js";\n',
              'import type { HumanIntentCorrectionReplayStore } from "./correction-replay-store.js";\nimport type { HumanIntentLearnLoop } from "./human-intent-learnloop.js";\n',
          )
          replace_once(
              trusted,
              '''export interface TrustedCorrectionIngestionOptions {
            publicKey: KeyLike;
            now?: () => Date;
            maximumConsumedApprovals?: number;
            isApprovalRevoked?: (approvalId: string) => boolean;
          }
          ''',
              '''export interface TrustedCorrectionIngestionOptions {
            publicKey: KeyLike;
            replayStore: HumanIntentCorrectionReplayStore;
            now?: () => Date;
            isApprovalRevoked?: (approvalId: string) => boolean;
          }
          ''',
          )
          replace_once(
              trusted,
              '''  private readonly now: () => Date;
            private readonly maximumConsumedApprovals: number;
            private readonly isApprovalRevoked: (approvalId: string) => boolean;
            private readonly consumedApprovalIds = new Map<string, number>();
            private readonly consumedNonces = new Map<string, number>();
          ''',
              '''  private readonly now: () => Date;
            private readonly isApprovalRevoked: (approvalId: string) => boolean;
          ''',
          )
          replace_once(
              trusted,
              '''    this.now = options.now ?? (() => new Date());
              this.maximumConsumedApprovals = boundedInteger(
                options.maximumConsumedApprovals ?? 4_096,
                1,
                100_000,
                "maximumConsumedApprovals",
              );
              this.isApprovalRevoked = options.isApprovalRevoked ?? (() => false);
          ''',
              '''    this.now = options.now ?? (() => new Date());
              this.isApprovalRevoked = options.isApprovalRevoked ?? (() => false);
          ''',
          )
          replace_once(trusted, '    this.pruneExpired(now.getTime());\n\n', '')
          replace_regex(
              trusted,
              r'''    if \(this\.consumedApprovalIds\.has\(validated\.claim\.approvalId\)\) \{.*?    this\.consumedNonces\.set\(validated\.claim\.nonce, validated\.expiresAtMs\);\n''',
              '''    assertClaimMatchesBinding(validated.claim, binding);
              let replayDecision;
              try {
                replayDecision = this.options.replayStore.reserve({
                  approvalId: validated.claim.approvalId,
                  nonce: validated.claim.nonce,
                  expiresAt: validated.claim.expiresAt,
                });
              } catch {
                throw new Error(
                  "Human Intent correction replay protection could not reserve this approval.",
                );
              }
              if (!replayDecision.allowed) throw new Error(replayDecision.reason);
          ''',
          )
          replace_regex(
              trusted,
              r'''  public consumedApprovalCount\(\): number \{.*?\n  \}\n\}\n\nexport function humanIntentCorrectionUiFingerprint''',
              '''  public consumedApprovalCount(): number {
              try {
                return this.options.replayStore.count();
              } catch {
                throw new Error(
                  "Human Intent correction replay protection could not read its reservation count.",
                );
              }
            }
          }

          export function humanIntentCorrectionUiFingerprint''',
          )

          replace_once(
              "packages/controller/src/index.ts",
              'export * from "./human-intent-learnloop.js";\n',
              'export * from "./human-intent-learnloop.js";\nexport * from "./correction-replay-store.js";\n',
          )

          test = "packages/controller/src/trusted-correction-ingestion.test.ts"
          replace_once(
              test,
              'import { HumanIntentLearnLoop } from "./human-intent-learnloop.js";\n',
              'import { InMemoryHumanIntentCorrectionReplayStore } from "./correction-replay-store.js";\nimport { HumanIntentLearnLoop } from "./human-intent-learnloop.js";\n',
          )
          replace_regex(
              test,
              r'''function ingestionGate\(.*?\n\}\n$''',
              '''function ingestionGate(
            overrides: {
              now?: () => Date;
              isApprovalRevoked?: (approvalId: string) => boolean;
            } = {},
          ): TrustedHumanIntentCorrectionIngestion {
            const now = overrides.now ?? (() => ingestionTime);
            return new TrustedHumanIntentCorrectionIngestion({
              publicKey: keyPair.publicKey,
              replayStore: new InMemoryHumanIntentCorrectionReplayStore({ now }),
              now,
              ...(overrides.isApprovalRevoked
                ? { isApprovalRevoked: overrides.isApprovalRevoked }
                : {}),
            });
          }
          ''',
          )

          desktop_test = "apps/desktop/src/main/prediction-first-browser-admission.test.ts"
          replace_once(
              desktop_test,
              '''  HumanIntentLearnLoop,
            TrustedHumanIntentCorrectionIngestion,
          ''',
              '''  HumanIntentLearnLoop,
            InMemoryHumanIntentCorrectionReplayStore,
            TrustedHumanIntentCorrectionIngestion,
          ''',
          )
          replace_regex(
              desktop_test,
              r'''    const ingestion = new TrustedHumanIntentCorrectionIngestion\(\{\n      publicKey: keyPair\.publicKey,\n      now: \(\) => correctionTime,\n    \}\);''',
              '''    const correctionNow = () => correctionTime;
            const ingestion = new TrustedHumanIntentCorrectionIngestion({
              publicKey: keyPair.publicKey,
              replayStore: new InMemoryHumanIntentCorrectionReplayStore({
                now: correctionNow,
              }),
              now: correctionNow,
            });''',
          )

          workflow = ".github/workflows/xtf-learnloop.yml"
          replace_once(
              workflow,
              '      - "packages/controller/src/trusted-correction-ingestion*"\n',
              '      - "packages/controller/src/trusted-correction-ingestion*"\n      - "packages/controller/src/correction-replay-store*"\n',
          )
          replace_once(
              workflow,
              '          packages/controller/src/trusted-correction-ingestion.test.ts\n',
              '          packages/controller/src/trusted-correction-ingestion.test.ts\n          packages/controller/src/correction-replay-store.test.ts\n',
          )
          PY
      - run: >-
          npx prettier --write
          packages/controller/src/correction-replay-store.ts
          packages/controller/src/correction-replay-store.test.ts
          packages/controller/src/trusted-correction-ingestion.ts
          packages/controller/src/trusted-correction-ingestion.test.ts
          packages/controller/src/index.ts
          apps/desktop/src/main/prediction-first-browser-admission.test.ts
          .github/workflows/xtf-learnloop.yml
      - run: npm run format:check
      - run: npm run typecheck
      - run: >-
          npx vitest run
          packages/controller/src/correction-replay-store.test.ts
          packages/controller/src/trusted-correction-ingestion.test.ts
          apps/desktop/src/main/prediction-first-browser-admission.test.ts
      - run: npm run lint
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/controller/src/correction-replay-store.ts \
            packages/controller/src/correction-replay-store.test.ts \
            packages/controller/src/trusted-correction-ingestion.ts \
            packages/controller/src/trusted-correction-ingestion.test.ts \
            packages/controller/src/index.ts \
            apps/desktop/src/main/prediction-first-browser-admission.test.ts \
            .github/workflows/xtf-learnloop.yml
          git commit -m "security(xtf): persist correction replay reservations"
          git pull --rebase origin xtf/lhic-learnloop
          git push origin HEAD:xtf/lhic-learnloop
