name: XTF temporary test diagnostics

on:
  push:
    branches:
      - xtf/lhic-learnloop

permissions:
  contents: read

env:
  CI: true

jobs:
  test-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture complete Vitest output
        shell: bash
        run: |
          set +e
          npm test > test-output.log 2>&1
          status=$?
          echo "$status" > test-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: xtf-vitest-diagnostics
          path: |
            test-output.log
            test-exit-code.txt
          retention-days: 1
