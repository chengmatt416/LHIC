name: XTF final security formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          apps/desktop/src/main/correction-submission-validation.ts
          apps/desktop/src/main/correction-submission-validation.test.ts
          apps/desktop/src/main/correction-ingestion-runtime.ts
          apps/desktop/src/main/correction-ingestion-runtime.test.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: >-
          npx vitest run
          apps/desktop/src/main/correction-submission-validation.test.ts
          apps/desktop/src/main/correction-ingestion-runtime.test.ts
      - run: npm run lint
      - name: Commit formatted security hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/desktop/src/main/correction-submission-validation.ts \
            apps/desktop/src/main/correction-submission-validation.test.ts \
            apps/desktop/src/main/correction-ingestion-runtime.ts \
            apps/desktop/src/main/correction-ingestion-runtime.test.ts
          git commit -m "style(xtf): format final correction hardening"
          git pull --rebase origin xtf/lhic-learnloop
          git push origin HEAD:xtf/lhic-learnloop
