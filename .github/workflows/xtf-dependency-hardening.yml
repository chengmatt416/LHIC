name: XTF temporary dependency-upgrade diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CI: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply upgrade in an ephemeral workspace
        run: |
          npm install @huggingface/transformers@4.2.0 --workspace @lhic/controller --save-exact
          npm pkg set 'overrides.fast-uri=3.1.4'
          npm install
      - name: Verify the v4 API boundary
        run: >-
          node --input-type=module -e
          "const module = await import('@huggingface/transformers');
          if (typeof module.pipeline !== 'function')
          throw new Error('Transformers v4 pipeline export is unavailable.');"
      - run: npm run format
      - name: Capture full verification outputs
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          echo "$?" > typecheck.exit.txt
          npm test > test.log 2>&1
          echo "$?" > test.exit.txt
          npm run lint > lint.log 2>&1
          echo "$?" > lint.exit.txt
          npm audit --omit=dev --audit-level=high --json > audit.json 2> audit.stderr
          echo "$?" > audit.exit.txt
          npm ls @huggingface/transformers sharp fast-uri --all > dependency-tree.log 2>&1
          echo "$?" > dependency-tree.exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: xtf-dependency-upgrade-diagnostics
          path: |
            typecheck.log
            typecheck.exit.txt
            test.log
            test.exit.txt
            lint.log
            lint.exit.txt
            audit.json
            audit.stderr
            audit.exit.txt
            dependency-tree.log
            dependency-tree.exit.txt
            package.json
            package-lock.json
            packages/controller/package.json
          retention-days: 1
