name: XTF production correction ingress v2 diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - name: Run uniquely scoped patch without committing
        shell: bash
        run: |
          git fetch --depth=1 origin 32f9325638e3e47a803adfe4498f3dd4bb81e6b1
          git show 32f9325638e3e47a803adfe4498f3dd4bb81e6b1:.github/workflows/xtf-production-correction-ingress.yml > /tmp/original-ingress.yml
          python <<'PY'
          from pathlib import Path

          workflow = Path("/tmp/original-ingress.yml").read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == "PY")
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end]
          ) + "\n"
          Path("/tmp/production-correction-ingress.py").write_text(script)
          path = Path("packages/controller/src/correction-replay-store.ts")
          source = path.read_text()
          needle = "  private readonly now: () => Date;\n  private readonly maximumReservations: number;\n"
          if source.count(needle) != 2:
              raise RuntimeError("Expected matching reservation fields in both replay stores.")
          marker = "  private readonly now: () => Date;\n  // XTF_TEMP_IN_MEMORY_SCOPE\n  private readonly maximumReservations: number;\n"
          path.write_text(source.replace(needle, marker, 1))
          PY
          set +e
          python /tmp/production-correction-ingress.py > correction-ingress.log 2>&1
          status=$?
          set -e
          echo "$status" > correction-ingress.status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xtf-production-correction-v2-diagnostic
          path: |
            correction-ingress.log
            correction-ingress.status
          retention-days: 1
