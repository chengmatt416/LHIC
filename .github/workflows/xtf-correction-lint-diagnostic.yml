name: XTF correction lint fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lint-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx eslint --fix packages/controller/src/trusted-correction-ingestion.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: >-
          npx vitest run
          packages/controller/src/trusted-correction-ingestion.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/controller/src/trusted-correction-ingestion.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(xtf): fix correction ingestion type import"
          git pull --rebase origin xtf/lhic-learnloop
          git push origin HEAD:xtf/lhic-learnloop
