name: XTF persistent correction replay export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reapply validated replay patch and remove dead helper
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/xtf-correction-replay-patch.yml").read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == "PY")
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end]
          ) + "\n"
          Path("/tmp/apply-correction-replay.py").write_text(script)
          PY
          python /tmp/apply-correction-replay.py
          python <<'PY'
          from pathlib import Path

          path = Path("packages/controller/src/trusted-correction-ingestion.ts")
          source = path.read_text()
          before = '''
          function boundedInteger(
            value: number,
            minimum: number,
            maximum: number,
            name: string,
          ): number {
            if (!Number.isSafeInteger(value) || value < minimum || value > maximum) {
              throw new Error(
                `${name} must be an integer from ${minimum} through ${maximum}.`,
              );
            }
            return value;
          }
          '''
          if source.count(before) != 1:
              raise RuntimeError("Expected one obsolete boundedInteger helper.")
          path.write_text(source.replace(before, "\n", 1))
          PY
      - run: >-
          npx prettier --write
          packages/controller/src/correction-replay-store.ts
          packages/controller/src/correction-replay-store.test.ts
          packages/controller/src/trusted-correction-ingestion.ts
          packages/controller/src/trusted-correction-ingestion.test.ts
          packages/controller/src/index.ts
          apps/desktop/src/main/prediction-first-browser-admission.test.ts
          .github/workflows/xtf-learnloop.yml
      - run: npm run format:check
      - run: npm run typecheck
      - run: >-
          npx vitest run
          packages/controller/src/correction-replay-store.test.ts
          packages/controller/src/trusted-correction-ingestion.test.ts
          apps/desktop/src/main/prediction-first-browser-admission.test.ts
      - run: npm run lint
      - name: Collect validated files
        run: |
          mkdir -p \
            validated/packages/controller/src \
            validated/apps/desktop/src/main \
            validated/.github/workflows
          cp packages/controller/src/correction-replay-store.ts validated/packages/controller/src/
          cp packages/controller/src/correction-replay-store.test.ts validated/packages/controller/src/
          cp packages/controller/src/trusted-correction-ingestion.ts validated/packages/controller/src/
          cp packages/controller/src/trusted-correction-ingestion.test.ts validated/packages/controller/src/
          cp packages/controller/src/index.ts validated/packages/controller/src/
          cp apps/desktop/src/main/prediction-first-browser-admission.test.ts validated/apps/desktop/src/main/
          cp .github/workflows/xtf-learnloop.yml validated/.github/workflows/
      - uses: actions/upload-artifact@v4
        with:
          name: xtf-persistent-correction-replay
          path: validated
          if-no-files-found: error
          retention-days: 1
