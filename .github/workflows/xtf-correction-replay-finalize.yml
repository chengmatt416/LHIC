name: XTF persistent correction replay finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reapply reviewed replay patch and remove dead helper
        run: |
          git fetch --depth=1 origin 770b8ffbb64ad21686a3066efc4914b2a96df15e
          git show 770b8ffbb64ad21686a3066efc4914b2a96df15e:.github/workflows/xtf-correction-replay-patch.yml > /tmp/replay-patch.yml
          python <<'PY'
          from pathlib import Path

          workflow = Path("/tmp/replay-patch.yml").read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == "PY")
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end]
          ) + "\n"
          Path("/tmp/apply-correction-replay.py").write_text(script)
          PY
          python /tmp/apply-correction-replay.py
          python <<'PY'
          from pathlib import Path

          path = Path("packages/controller/src/trusted-correction-ingestion.ts")
          source = path.read_text()
          before = '''
          function boundedInteger(
            value: number,
            minimum: number,
            maximum: number,
            name: string,
          ): number {
            if (!Number.isSafeInteger(value) || value < minimum || value > maximum) {
              throw new Error(
                `${name} must be an integer from ${minimum} through ${maximum}.`,
              );
            }
            return value;
          }
          '''
          if source.count(before) != 1:
              raise RuntimeError("Expected one obsolete boundedInteger helper.")
          path.write_text(source.replace(before, "\n", 1))
          PY
      - run: >-
          npx prettier --write
          packages/controller/src/correction-replay-store.ts
          packages/controller/src/correction-replay-store.test.ts
          packages/controller/src/trusted-correction-ingestion.ts
          packages/controller/src/trusted-correction-ingestion.test.ts
          packages/controller/src/index.ts
          apps/desktop/src/main/prediction-first-browser-admission.test.ts
      - run: npm run format:check
      - run: npm run typecheck
      - run: >-
          npx vitest run
          packages/controller/src/correction-replay-store.test.ts
          packages/controller/src/trusted-correction-ingestion.test.ts
          apps/desktop/src/main/prediction-first-browser-admission.test.ts
      - run: npm run lint
      - name: Commit validated product files
        run: |
          git checkout -- .github/workflows/xtf-learnloop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/controller/src/correction-replay-store.ts \
            packages/controller/src/correction-replay-store.test.ts \
            packages/controller/src/trusted-correction-ingestion.ts \
            packages/controller/src/trusted-correction-ingestion.test.ts \
            packages/controller/src/index.ts \
            apps/desktop/src/main/prediction-first-browser-admission.test.ts
          git commit -m "security(xtf): persist correction replay reservations"
          git pull --rebase origin xtf/lhic-learnloop
          git push origin HEAD:xtf/lhic-learnloop
