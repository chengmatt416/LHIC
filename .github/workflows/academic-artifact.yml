name: Academic Artifact

on:
  push:
    branches:
      - research/lhic-core-academic
  pull_request:

jobs:
  invariant-tests:
    runs-on: ubuntu-latest
    env:
      LHIC_OVERHEAD_TRIALS: "80"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run LHIC-Core invariants
        run: npm test
      - name: Run deterministic failure injection
        run: npm run bench
      - name: Measure paired no-fault reference-artifact overhead
        run: npm run bench:overhead
      - name: Validate OSWorld runner interposition and TypeScript bridge
        working-directory: adapters/osworld-v2
        run: python3 -m unittest -v test_runner_boundary.py test_bridge_client.py
      - name: Validate pinned OSWorld v2026.06.24 upstream runner contract
        run: |
          git clone --depth 1 --branch v2026.06.24 https://github.com/xlang-ai/OSWorld-V2.git /tmp/osworld-v2
          python3 adapters/osworld-v2/check_pinned_contract.py /tmp/osworld-v2
      - name: Upload academic overhead evidence
        uses: actions/upload-artifact@v4
        with:
          name: lhic-academic-overhead
          path: artifacts/no-fault-overhead-results.json
          if-no-files-found: error
