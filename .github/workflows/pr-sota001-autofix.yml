name: PR-SOTA-001 autofix

on:
  push:
    branches:
      - feature/sota-improvements

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply trust fixes
        run: python .github/pr-sota001-autofix.py
      - name: Apply production audit override
        run: python .github/pr-sota001-audit-fix.py
      - name: Remove stale sharp lock entries
        run: python .github/pr-sota001-lock-fix.py
      - name: Re-resolve patched sharp lock entries
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Install exact dependency graph
        run: npm ci
      - name: Show resolved sharp
        run: npm ls sharp || true
      - name: Format touched source
        run: npx prettier --write package.json packages/omp-rpc/src/omp-version.ts packages/omp-rpc/src/omp-version.test.ts apps/desktop/scripts/fetch-omp.mjs benchmarks/agent-competitive/run.mjs
      - name: Verify production dependency audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > npm-audit.json
          status=$?
          cat npm-audit.json
          exit $status
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-sota001-audit
          path: npm-audit.json
          if-no-files-found: ignore
      - name: Typecheck
        run: npm run typecheck
      - name: Run OMP trust tests
        run: npx vitest run packages/omp-rpc/src/omp-version.test.ts
      - name: Lint
        run: npm run lint
      - name: Benchmark harness self-test
        run: npm run bench:agent:self-test
      - name: Check patch integrity
        run: git diff --check
      - name: Commit verified fix and remove bootstrap files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr-sota001-autofix.yml \
            .github/pr-sota001-autofix.py \
            .github/pr-sota001-audit-fix.py \
            .github/pr-sota001-lock-fix.py
          git add package.json package-lock.json \
            packages/omp-rpc/src/omp-version.ts \
            packages/omp-rpc/src/omp-version.test.ts \
            apps/desktop/scripts/fetch-omp.mjs \
            benchmarks/agent-competitive/run.mjs
          git commit -m "fix(sota): close PR-SOTA-001 trust and audit blockers"
          git push origin HEAD:feature/sota-improvements
