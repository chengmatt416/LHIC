name: XTF one-shot lint remediation

on:
  push:
    branches: [xtf/lhic-learnloop]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - name: Apply lint-safe changes without weakening rules
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const learnLoopPath = 'packages/controller/src/human-intent-learnloop.ts';
          let learnLoop = fs.readFileSync(learnLoopPath, 'utf8');
          const regexCheck = '        /[\\u0000-\\u001f\\u007f]/.test(token),';
          if (!learnLoop.includes(regexCheck)) {
            throw new Error('Control-character check not found.');
          }
          learnLoop = learnLoop.replace(regexCheck, '        hasControlCharacter(token),');
          const helperAnchor = 'function allUnique(values: readonly string[]): boolean {';
          const helper = `function hasControlCharacter(value: string): boolean {\n  for (const character of value) {\n    const codePoint = character.codePointAt(0);\n    if (codePoint !== undefined && (codePoint <= 31 || codePoint === 127)) {\n      return true;\n    }\n  }\n  return false;\n}\n\n`;
          if (!learnLoop.includes(helperAnchor)) {
            throw new Error('Helper insertion point not found.');
          }
          learnLoop = learnLoop.replace(helperAnchor, helper + helperAnchor);
          fs.writeFileSync(learnLoopPath, learnLoop);

          const facadePath = 'packages/controller/src/prediction-first-human-intent-controller.ts';
          let facade = fs.readFileSync(facadePath, 'utf8');
          const routerImport = `import {\n  FastPathRouter,\n  type ResolvedRoute,\n  type RouteDecision,\n} from "./fast-path-router.js";`;
          const routerTypeImport = `import type {\n  FastPathRouter,\n  ResolvedRoute,\n  RouteDecision,\n} from "./fast-path-router.js";`;
          const loopImport = `import {\n  HumanIntentLearnLoop,\n  type HumanIntentDecision,\n} from "./human-intent-learnloop.js";`;
          const loopTypeImport = `import type {\n  HumanIntentDecision,\n  HumanIntentLearnLoop,\n} from "./human-intent-learnloop.js";`;
          if (!facade.includes(routerImport) || !facade.includes(loopImport)) {
            throw new Error('Type-only import blocks not found.');
          }
          facade = facade.replace(routerImport, routerTypeImport).replace(loopImport, loopTypeImport);
          fs.writeFileSync(facadePath, facade);
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/xtf-lint-debug.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(xtf): satisfy lint without weakening validation"
          git push origin HEAD:xtf/lhic-learnloop
# Triggered after enabling the push event.
