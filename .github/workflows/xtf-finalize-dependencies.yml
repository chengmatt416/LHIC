name: XTF final dependency and runtime commit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  CI: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Replace the vulnerable native embedding chain
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const read = (path) => fs.readFileSync(path, "utf8");
          const write = (path, value) => fs.writeFileSync(path, value);
          const replace = (path, before, after, label) => {
            const source = read(path);
            if (!source.includes(before)) {
              throw new Error(`Missing ${label} in ${path}.`);
            }
            write(path, source.replace(before, after));
          };

          const learningPath = "packages/controller/src/demo-learning.ts";
          let learning = read(learningPath);
          learning = learning.replace(
            'const embeddingModel = "Xenova/all-MiniLM-L6-v2";\n',
            "const embeddingDimensions = 256;\n",
          );
          const classStart = learning.indexOf(
            "/** Lazily downloads once, then uses a locally cached transformer model. */",
          );
          const classEnd = learning.indexOf(
            "export async function learnDemoSkill",
            classStart,
          );
          if (classStart < 0 || classEnd < 0) {
            throw new Error("Legacy embedding engine block was not found.");
          }
          const replacement = `/**
           * Dependency-free local semantic feature hashing. It performs no model
           * download, native addon load, network call, or dynamic code execution.
           */
          export class LocalFeatureHashEmbeddingEngine implements LocalEmbeddingEngine {
            public async embed(input: string): Promise<number[]> {
              return featureHashEmbedding(input);
            }
          }

          /** @deprecated Use LocalFeatureHashEmbeddingEngine. */
          export class TransformersEmbeddingEngine extends LocalFeatureHashEmbeddingEngine {}

          `;
          learning =
            learning.slice(0, classStart) + replacement + learning.slice(classEnd);
          const helperAnchor = "function cosineSimilarity(\n";
          if (!learning.includes(helperAnchor)) {
            throw new Error("Embedding helper insertion point was not found.");
          }
          const helper = `function featureHashEmbedding(input: string): number[] {
            const normalized = redactPII(input)
              .normalize("NFKC")
              .toLowerCase()
              .slice(0, 8_192);
            const tokens = normalized.match(/[\\p{L}\\p{N}]+/gu) ?? [];
            const features: string[] = [];
            for (let index = 0; index < tokens.length; index += 1) {
              const token = tokens[index]!;
              features.push(\`token:\${token}\`);
              if (token.length >= 3) {
                for (let offset = 0; offset <= token.length - 3; offset += 1) {
                  features.push(\`tri:\${token.slice(offset, offset + 3)}\`);
                }
              }
              const next = tokens[index + 1];
              if (next) features.push(\`pair:\${token}:\${next}\`);
            }
            const vector = Array<number>(embeddingDimensions).fill(0);
            for (const feature of features.slice(0, 2_048)) {
              const primary = fnv1a(feature);
              const secondary = fnv1a(\`sign:\${feature}\`);
              vector[primary % embeddingDimensions]! +=
                (secondary & 1) === 0 ? 1 : -1;
            }
            const magnitude = Math.sqrt(
              vector.reduce((sum, value) => sum + value * value, 0),
            );
            return magnitude === 0
              ? vector
              : vector.map((value) => value / magnitude);
          }

          function fnv1a(value: string): number {
            let hash = 0x811c9dc5;
            for (const character of value) {
              hash ^= character.codePointAt(0) ?? 0;
              hash = Math.imul(hash, 0x01000193);
            }
            return hash >>> 0;
          }

          `;
          learning = learning.replace(helperAnchor, helper + helperAnchor);
          write(learningPath, learning);

          for (const path of [
            "apps/cli/src/interactive-demo.ts",
            "apps/mcp-server/src/index.ts",
          ]) {
            let source = read(path);
            source = source.replaceAll(
              "TransformersEmbeddingEngine",
              "LocalFeatureHashEmbeddingEngine",
            );
            source = source.replace(
              "Learning the verified task locally (first run may download the embedding model)…",
              "Learning the verified task locally with dependency-free semantic hashing…",
            );
            write(path, source);
          }

          const testPath = "packages/controller/src/demo-learning.test.ts";
          let test = read(testPath);
          test = test.replace(
            "  findSimilarDemoSkill,\n",
            "  LocalFeatureHashEmbeddingEngine,\n  findSimilarDemoSkill,\n",
          );
          const testAnchor =
            '  it("removes all form values from model observations", () => {';
          if (!test.includes(testAnchor)) {
            throw new Error("Embedding test insertion point was not found.");
          }
          const engineTest = `  it("produces bounded deterministic local semantic embeddings", async () => {
            const engine = new LocalFeatureHashEmbeddingEngine();
            const first = await engine.embed("Search release notes");
            const repeated = await engine.embed("Search release notes");
            const related = await engine.embed("Search the release documentation");
            const unrelated = await engine.embed("Delete a billing account");
            expect(first).toHaveLength(256);
            expect(repeated).toEqual(first);
            expect(dot(first, related)).toBeGreaterThan(dot(first, unrelated));
            expect(first.every(Number.isFinite)).toBe(true);
          });

          `;
          test = test.replace(testAnchor, engineTest + testAnchor);
          test += `
          function dot(
            left: readonly number[],
            right: readonly number[],
          ): number {
            return left.reduce(
              (sum, value, index) => sum + value * (right[index] ?? 0),
              0,
            );
          }
          `;
          write(testPath, test);

          const controllerPackagePath = "packages/controller/package.json";
          const controllerPackage = JSON.parse(read(controllerPackagePath));
          delete controllerPackage.dependencies["@huggingface/transformers"];
          write(
            controllerPackagePath,
            `${JSON.stringify(controllerPackage, null, 2)}\n`,
          );

          const rootPath = "package.json";
          const root = JSON.parse(read(rootPath));
          root.scripts["audit:prod"] =
            "npm audit --omit=dev --audit-level=moderate";
          root.overrides = {
            ...(root.overrides ?? {}),
            "@hono/node-server": "2.0.11",
            "fast-uri": "3.1.4",
          };
          write(rootPath, `${JSON.stringify(root, null, 2)}\n`);

          const researchPath = "XTF-LEARNLOOP.md";
          let research = read(researchPath);
          research = research.replace(
            "The production Desktop `TaskService` is **not yet LearnLoop-aware**. It attempts to compile a local plan before a live normalized UI state has been observed, while the research controller requires both the human goal and current UI state. A production integration must therefore occur after browser observation and must obtain correction confirmation and verifier provenance from LHIC's existing signed approval and verification path. The branch does not claim that desktop task execution currently uses LearnLoop.",
            "The production Desktop `TaskService` now attaches Human Intent admission only to deterministic local browser Fast Paths. `DesktopBrowserRunner` first executes and verifies the fixed low-risk navigation bootstrap, observes live normalized UI, and then runs prediction-first admission before any mutable task action. Slow Path provider proposals and global desktop plans retain their existing approval and verifier flows and are not silently promoted by LearnLoop.",
          );
          research = research.replace(
            "- It does not claim that the current Desktop `TaskService` is LearnLoop-integrated.\n",
            "- It does not claim that verified runtime outcomes are automatically persisted as signed LearnLoop corrections; that capture boundary remains explicit.\n",
          );
          research = research.replace(
            "Before presenting a desktop end-to-end demo as research evidence, wire the research controller after live UI observation, bind `confirmedByUser` and verifier evidence to the existing signed runtime records, and test that failures feed back into rule quarantine without weakening any execution gate.",
            "Before presenting continual adaptation as end-to-end production evidence, bind `confirmedByUser`, correction provenance, and post-execution verifier outcomes to existing signed runtime records, persist the HMAC key in the OS keyring, and demonstrate rule quarantine from real failed executions.",
          );
          write(researchPath, research);

          const reviewPath = "docs/xtf-adversarial-review.md";
          let review = read(reviewPath);
          if (!review.includes("## Supply-chain and desktop integration pass")) {
            review += `

          ## Supply-chain and desktop integration pass

          The production audit found that the optional local embedding demo pulled a native dependency chain through \\`@huggingface/transformers\\`, including vulnerable Sharp builds; upgrading the package also introduced an ONNX/adm-zip advisory. The final design removes that dependency rather than hiding the advisory. Demo skill similarity now uses bounded, normalized, dependency-free feature hashing, with the former class name retained only as a deprecated API alias.

          Desktop local Fast Paths are now admitted against live normalized UI after a verified, fixed low-risk navigation bootstrap and before mutable browser actions. The existing executor, approval, and verifier remain authoritative. Slow Path proposals are intentionally excluded from this exact-plan admission because applying a built-in-plan equality check to model-produced plans would incorrectly block the guarded Slow Path rather than improve Human Intent prediction.

          Residual limitations remain: feature hashing is not a semantic foundation model; the synthetic benchmark is small; and verified corrections are not yet automatically captured from signed desktop outcome records. Those limitations must remain visible in the XTF paper.
          `;
          }
          write(reviewPath, review);
          NODE
      - name: Resolve a clean production dependency graph
        run: |
          SAFE_TAR_VERSION="$(npm view tar version)"
          npm pkg set "overrides.tar=${SAFE_TAR_VERSION}"
          npm install --package-lock-only
          npm audit fix --package-lock-only --omit=dev || true
          npm ci
          npm audit --omit=dev --audit-level=moderate
      - run: npm run pw:install
      - name: Format and validate the complete repository
        run: |
          npm run format
          npm run format:check
          npm run typecheck
          npm test
          npm run lint
          npm run build
          npm run bench:internal
          npm run bench:learnloop
          npm run preflight
          npm run audit:prod
          npm run check:docs
          npm run check:release-versions
          npm run scan:secrets
          PYTHONPATH=benchmarks/agentlab python -m unittest discover -s benchmarks/agentlab/tests
          python packages/game-training/python/test_worker.py
          python -m py_compile benchmarks/agentlab/lhic_semantic_policy.py benchmarks/agentlab/lhic_agent.py benchmarks/agentlab/preflight.py benchmarks/agentlab/run_study.py
      - name: Create a validated Git commit object without moving the branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const fs = require("node:fs");

          const exec = (command, args) =>
            execFileSync(command, args, { encoding: "utf8" }).trim();
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          if (!repository || !token) throw new Error("GitHub context is missing.");
          const parent = exec("git", ["rev-parse", "HEAD"]);
          const baseTree = exec("git", ["rev-parse", "HEAD^{tree}"]);
          const changed = exec("git", ["diff", "--name-only"])
            .split("\n")
            .filter(Boolean)
            .filter(
              (path) =>
                path !== ".github/workflows/xtf-format-diagnostic.yml" &&
                path !== ".github/workflows/xtf-finalize-dependencies.yml",
            );
          const api = async (path, body) => {
            const response = await fetch(
              `https://api.github.com/repos/${repository}${path}`,
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  Accept: "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                },
                body: JSON.stringify(body),
              },
            );
            if (!response.ok) {
              throw new Error(`${path} failed: ${response.status} ${await response.text()}`);
            }
            return response.json();
          };

          (async () => {
            const tree = [];
            for (const path of changed) {
              const blob = await api("/git/blobs", {
                content: fs.readFileSync(path).toString("base64"),
                encoding: "base64",
              });
              const tracked = exec("git", ["ls-files", "-s", "--", path]);
              const mode = tracked ? tracked.split(/\s+/)[0] : "100644";
              tree.push({ path, mode, type: "blob", sha: blob.sha });
            }
            for (const path of [
              ".github/workflows/xtf-format-diagnostic.yml",
              ".github/workflows/xtf-finalize-dependencies.yml",
            ]) {
              tree.push({ path, mode: "100644", type: "blob", sha: null });
            }
            const createdTree = await api("/git/trees", {
              base_tree: baseTree,
              tree,
            });
            const commit = await api("/git/commits", {
              message:
                "fix(xtf): finalize live intent runtime and secure dependencies",
              tree: createdTree.sha,
              parents: [parent],
            });
            const report = {
              parent,
              commit: commit.sha,
              tree: createdTree.sha,
              files: changed,
            };
            fs.writeFileSync(
              "validated-final-commit.json",
              `${JSON.stringify(report, null, 2)}\n`,
            );
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: xtf-validated-final-commit
          path: validated-final-commit.json
          if-no-files-found: error
          retention-days: 1
