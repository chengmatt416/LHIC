name: Fair Public Harness Comparator

on:
  workflow_dispatch:
  push:
    branches:
      - research/lhic-core-academic
    paths:
      - 'experiments/fair-harness-comparator/**'
      - '.github/workflows/fair-public-harness-comparator.yml'

jobs:
  fair-comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Run one-command fair comparator
        shell: bash
        run: |
          bash experiments/fair-harness-comparator/reproduce.sh \
            --trials 10 \
            --out artifacts/fair-harness-comparator
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fair-public-harness-comparator-evidence
          path: artifacts/fair-harness-comparator
          if-no-files-found: warn
