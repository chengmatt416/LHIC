name: XTF lint-only remediation

on:
  push:
    branches: [xtf/lhic-learnloop]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtf/lhic-learnloop
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply behavior-preserving lint fixes
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const facadePath = 'packages/controller/src/prediction-first-human-intent-controller.ts';
          let facade = fs.readFileSync(facadePath, 'utf8');
          facade = facade.replace(
            `import {\n  FastPathRouter,\n  type ResolvedRoute,\n  type RouteDecision,\n} from "./fast-path-router.js";`,
            `import type {\n  FastPathRouter,\n  ResolvedRoute,\n  RouteDecision,\n} from "./fast-path-router.js";`,
          );
          facade = facade.replace(
            `import {\n  HumanIntentLearnLoop,\n  type HumanIntentDecision,\n} from "./human-intent-learnloop.js";`,
            `import type {\n  HumanIntentDecision,\n  HumanIntentLearnLoop,\n} from "./human-intent-learnloop.js";`,
          );
          fs.writeFileSync(facadePath, facade);

          const loopPath = 'packages/controller/src/human-intent-learnloop.ts';
          let loop = fs.readFileSync(loopPath, 'utf8');
          const regexCheck = `/[\\u0000-\\u001f\\u007f]/.test(token)`;
          if (!loop.includes(regexCheck)) {
            throw new Error('Control-character validation target missing.');
          }
          loop = loop.replace(regexCheck, 'hasAsciiControlCharacter(token)');
          const insertion = `function allUnique(values: readonly string[]): boolean {\n  return values.length <= 128 && values.length === new Set(values).size;\n}\n`;
          const replacement = `${insertion}\nfunction hasAsciiControlCharacter(value: string): boolean {\n  return [...value].some((character) => {\n    const code = character.charCodeAt(0);\n    return code <= 0x1f || code === 0x7f;\n  });\n}\n`;
          if (!loop.includes(insertion)) {
            throw new Error('Helper insertion target missing.');
          }
          loop = loop.replace(insertion, replacement);
          fs.writeFileSync(loopPath, loop);
          NODE
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Commit lint remediation and remove temporary workflows
        run: |
          git rm .github/workflows/xtf-lint-diagnostics.yml
          git rm .github/workflows/xtf-lint-debug.yml
          git rm .github/workflows/xtf-lint-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix(xtf): satisfy lint without weakening validation"
          git push origin HEAD:xtf/lhic-learnloop
