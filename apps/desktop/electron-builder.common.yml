appId: io.github.chengmatt416.lhic
productName: LHIC Control Center
executableName: lhic-control-center
artifactName: lhic-control-center-${os}-${version}-${arch}.${ext}
directories:
  output: release
extraResources:
  - from: vendor/omp/current
    to: omp
    filter:
      - "**/*"
  - from: ../../packages/skills/src/execution
    to: execution
    filter:
      - "**/*"
win:
  icon: build/icon.ico
  target:
    - nsis
linux:
  syncDesktopName: true
  category: Utility
  maintainer: chengmatt416 <chengmatt416@gmail.com>
  icon: build/icon.png
  target:
    - AppImage
    - deb
    - rpm
    - zip
deb:
  packageName: lhic-control-center
rpm:
  packageName: lhic-control-center
files:
  - dist/**
  - package.json
  # onnxruntime-node ships a CUDA/TensorRT provider only for linux/x64
  # (~344 MB); OmniParser V2 executes on the CPU runtime, so the unused
  # provider libs are excluded from every package.
  - "!node_modules/onnxruntime-node/bin/napi-v3/linux/x64/libonnxruntime_providers_cuda.so"
  - "!node_modules/onnxruntime-node/bin/napi-v3/linux/x64/libonnxruntime_providers_tensorrt.so"
  - from: ../../packages/game-training/dist
  - from: ../../packages/game-training/dist
    to: node_modules/@lhic/game-training/dist
    filter:
      - desktop-recording.js
asarUnpack:
  - node_modules/@lhic/game-training/python/**
  - node_modules/@lhic/game-training/requirements.txt
  - node_modules/@pinyencheng/lhic/node_modules/@lhic/game-training/python/**
  - node_modules/@pinyencheng/lhic/node_modules/@lhic/game-training/requirements.txt
